<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>학습 현황 대시보드 - 관리자</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <style>
        body { font-family: 'Inter', 'Noto Sans KR', sans-serif; }
        .key-btn { transition: transform 0.08s, background 0.08s; user-select: none; }
        .key-btn:active { transform: scale(0.92); }
        .pin-dot { transition: background 0.15s, transform 0.15s; }
        .pin-dot.filled { background: #9d4300; transform: scale(1.15); }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-6px); }
            80% { transform: translateX(6px); }
        }
        .shake { animation: shake 0.4s ease; }
        .chevron-open { transform: rotate(180deg); }
    </style>
</head>

<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-200 min-h-screen">

<!-- ── PIN Gate ───────────────────────────────────────────── -->
<div id="pinGate" class="fixed inset-0 z-50 bg-slate-50 dark:bg-slate-950 flex items-center justify-center p-4">
    <div class="w-full max-w-xs bg-white dark:bg-slate-900 rounded-2xl shadow-2xl overflow-hidden border border-slate-100 dark:border-slate-800">
        <div class="px-6 pt-6 pb-4 text-center">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-full mb-3"
                style="background: linear-gradient(135deg, #9d4300, #f97316)">
                <span class="material-symbols-outlined text-white text-xl" style="font-variation-settings:'FILL' 1">bar_chart</span>
            </div>
            <h2 class="font-bold text-lg text-slate-800 dark:text-slate-100">학습 현황 대시보드</h2>
            <p class="text-slate-400 text-xs mt-1">선생님 PIN을 입력하세요</p>
        </div>
        <div id="gatePinDots" class="flex justify-center gap-4 py-3">
            <div class="pin-dot w-4 h-4 rounded-full border-2 border-slate-200 dark:border-slate-700"></div>
            <div class="pin-dot w-4 h-4 rounded-full border-2 border-slate-200 dark:border-slate-700"></div>
            <div class="pin-dot w-4 h-4 rounded-full border-2 border-slate-200 dark:border-slate-700"></div>
            <div class="pin-dot w-4 h-4 rounded-full border-2 border-slate-200 dark:border-slate-700"></div>
        </div>
        <div id="gateError" class="hidden mx-5 mb-3 px-3 py-2 rounded-lg bg-red-50 dark:bg-red-900/20 text-red-600 dark:text-red-400 text-xs font-bold text-center"></div>
        <div class="px-5 pb-5">
            <div class="grid grid-cols-3 gap-2">
                <button class="key-btn h-12 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 font-bold text-lg" onclick="gateKey('1')">1</button>
                <button class="key-btn h-12 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 font-bold text-lg" onclick="gateKey('2')">2</button>
                <button class="key-btn h-12 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 font-bold text-lg" onclick="gateKey('3')">3</button>
                <button class="key-btn h-12 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 font-bold text-lg" onclick="gateKey('4')">4</button>
                <button class="key-btn h-12 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 font-bold text-lg" onclick="gateKey('5')">5</button>
                <button class="key-btn h-12 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 font-bold text-lg" onclick="gateKey('6')">6</button>
                <button class="key-btn h-12 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 font-bold text-lg" onclick="gateKey('7')">7</button>
                <button class="key-btn h-12 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 font-bold text-lg" onclick="gateKey('8')">8</button>
                <button class="key-btn h-12 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 font-bold text-lg" onclick="gateKey('9')">9</button>
                <div></div>
                <button class="key-btn h-12 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 font-bold text-lg" onclick="gateKey('0')">0</button>
                <button class="key-btn h-12 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 flex items-center justify-center text-slate-400" onclick="gateBackspace()">
                    <span class="material-symbols-outlined text-lg">backspace</span>
                </button>
            </div>
        </div>
        <div class="px-5 pb-5 text-center">
            <a href="admin.html" class="text-xs text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 transition-colors">
                ← 관리자 페이지로
            </a>
        </div>
    </div>
</div>

<!-- ── Toast ─────────────────────────────────────────────── -->
<div id="toast" class="fixed top-4 right-4 z-40 hidden px-4 py-3 rounded-xl text-sm font-bold shadow-lg text-white"></div>

<!-- ── Main ──────────────────────────────────────────────── -->
<div id="mainContent" class="hidden min-h-screen">

    <!-- Sticky Header -->
    <header class="sticky top-0 z-30 bg-white/80 dark:bg-slate-900/80 backdrop-blur border-b border-slate-100 dark:border-slate-800">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-between gap-3">
            <div class="flex items-center gap-3">
                <a href="admin.html" class="p-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
                    <span class="material-symbols-outlined text-slate-500 text-xl">arrow_back</span>
                </a>
                <div>
                    <p class="text-xs font-bold text-orange-500 uppercase tracking-widest leading-none">Admin</p>
                    <h1 class="text-base font-black leading-tight">학습 현황 대시보드</h1>
                </div>
            </div>
            <div class="flex items-center gap-1">
                <button onclick="loadDashboard()" class="p-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" title="새로고침">
                    <span class="material-symbols-outlined text-slate-400 text-xl">refresh</span>
                </button>
                <button onclick="document.documentElement.classList.toggle('dark')" class="p-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
                    <span class="material-symbols-outlined text-slate-400 text-xl">dark_mode</span>
                </button>
                <button onclick="logout()" class="p-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" title="로그아웃">
                    <span class="material-symbols-outlined text-slate-400 text-xl">logout</span>
                </button>
            </div>
        </div>
    </header>

    <div class="max-w-4xl mx-auto px-4 sm:px-6 py-6 space-y-5">

        <!-- View Toggle -->
        <div class="flex gap-1 bg-white dark:bg-slate-900 rounded-2xl p-1 shadow-sm border border-slate-100 dark:border-slate-800">
            <button id="viewDailyBtn" onclick="setView('daily')"
                class="flex-1 flex items-center justify-center gap-1.5 py-2 rounded-xl text-sm font-bold transition-all">
                <span class="material-symbols-outlined text-base">today</span>일별
            </button>
            <button id="viewWeeklyBtn" onclick="setView('weekly')"
                class="flex-1 flex items-center justify-center gap-1.5 py-2 rounded-xl text-sm font-bold transition-all">
                <span class="material-symbols-outlined text-base">calendar_view_week</span>주간
            </button>
        </div>

        <!-- Date Navigator (일별) -->
        <div id="dailyNav" class="flex items-center justify-between bg-white dark:bg-slate-900 rounded-2xl px-4 py-3 shadow-sm border border-slate-100 dark:border-slate-800">
            <button onclick="changeDate(-1)" class="p-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors active:scale-90">
                <span class="material-symbols-outlined text-slate-500">chevron_left</span>
            </button>
            <div class="text-center">
                <p id="dateDisplay" class="font-bold text-slate-800 dark:text-slate-100"></p>
                <p id="dateSubDisplay" class="text-xs text-slate-400 font-medium"></p>
            </div>
            <button id="nextDateBtn" onclick="changeDate(1)" class="p-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors active:scale-90">
                <span class="material-symbols-outlined text-slate-500">chevron_right</span>
            </button>
        </div>

        <!-- Week Navigator (주간) -->
        <div id="weeklyNav" class="hidden flex items-center justify-between bg-white dark:bg-slate-900 rounded-2xl px-4 py-3 shadow-sm border border-slate-100 dark:border-slate-800">
            <button onclick="changeWeek(-1)" class="p-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors active:scale-90">
                <span class="material-symbols-outlined text-slate-500">chevron_left</span>
            </button>
            <div class="text-center">
                <p id="weekDisplay" class="font-bold text-slate-800 dark:text-slate-100"></p>
                <p id="weekSubDisplay" class="text-xs text-slate-400 font-medium"></p>
            </div>
            <button id="nextWeekBtn" onclick="changeWeek(1)" class="p-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors active:scale-90">
                <span class="material-symbols-outlined text-slate-500">chevron_right</span>
            </button>
        </div>

        <!-- Stat Chips -->
        <div class="grid grid-cols-3 gap-3">
            <div class="bg-white dark:bg-slate-900 rounded-2xl p-4 shadow-sm border border-slate-100 dark:border-slate-800 text-center">
                <p class="text-2xl font-black text-slate-800 dark:text-slate-100" id="statTotal">—</p>
                <p class="text-xs text-slate-400 font-medium mt-0.5">전체 학생</p>
            </div>
            <div class="bg-white dark:bg-slate-900 rounded-2xl p-4 shadow-sm border border-slate-100 dark:border-slate-800 text-center">
                <p class="text-2xl font-black text-green-500" id="statCompleted">—</p>
                <p class="text-xs text-slate-400 font-medium mt-0.5">목표 달성</p>
            </div>
            <div class="bg-white dark:bg-slate-900 rounded-2xl p-4 shadow-sm border border-slate-100 dark:border-slate-800 text-center">
                <p class="text-2xl font-black text-orange-500" id="statAvgPct">—</p>
                <p class="text-xs text-slate-400 font-medium mt-0.5" id="statAvgLabel">평균 달성률</p>
            </div>
        </div>

        <!-- Student Accordion -->
        <section class="bg-white dark:bg-slate-900 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-800 overflow-hidden">
            <div class="px-5 py-4 border-b border-slate-100 dark:border-slate-800 flex items-center gap-2">
                <span class="material-symbols-outlined text-orange-500 text-xl" style="font-variation-settings:'FILL' 1">group</span>
                <h2 class="font-bold text-sm" id="sectionTitle">학생별 학습 결과</h2>
            </div>
            <div id="studentList" class="divide-y divide-slate-100 dark:divide-slate-800">
                <div class="text-center py-10 text-slate-400 text-sm">불러오는 중...</div>
            </div>
        </section>

    </div>
</div>

<script type="module" src="js/api.js"></script>
<script>
    function escHtml(str) {
        return String(str ?? '')
            .replace(/&/g,'&amp;').replace(/</g,'&lt;')
            .replace(/>/g,'&gt;').replace(/"/g,'&quot;')
            .replace(/'/g,'&#39;');
    }

    // ── 날짜 헬퍼 ─────────────────────────────────────────────
    function todayKST() {
        return new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Seoul' });
    }
    function mondayOfWeek(dateStr) {
        const [y, m, d] = dateStr.split('-').map(Number);
        const date = new Date(Date.UTC(y, m - 1, d));
        const day = date.getUTCDay();
        date.setUTCDate(d - (day === 0 ? 6 : day - 1));
        return date.toISOString().slice(0, 10);
    }

    // ── 뷰 상태 ───────────────────────────────────────────────
    let currentView = 'daily';
    let currentDate = todayKST();
    let currentWeek = mondayOfWeek(todayKST()); // 이번 주 월요일

    function setView(view) {
        currentView = view;
        const isDaily = view === 'daily';
        document.getElementById('dailyNav').classList.toggle('hidden', !isDaily);
        document.getElementById('weeklyNav').classList.toggle('hidden', isDaily);
        document.getElementById('statCompleted').parentElement.style.display = isDaily ? '' : 'none';
        document.getElementById('statAvgLabel').textContent = isDaily ? '평균 달성률' : '주간 활성';
        document.getElementById('statAvgPct').textContent = '—';
        document.getElementById('sectionTitle').textContent = isDaily ? '학생별 학습 결과' : '학생별 주간 현황';

        // 토글 버튼 스타일
        const activeClass = ['bg-orange-500', 'text-white', 'shadow-sm'];
        const inactiveClass = ['text-slate-500'];
        const dailyBtn  = document.getElementById('viewDailyBtn');
        const weeklyBtn = document.getElementById('viewWeeklyBtn');
        if (isDaily) {
            dailyBtn.classList.add(...activeClass);
            dailyBtn.classList.remove(...inactiveClass);
            weeklyBtn.classList.remove(...activeClass);
            weeklyBtn.classList.add(...inactiveClass);
        } else {
            weeklyBtn.classList.add(...activeClass);
            weeklyBtn.classList.remove(...inactiveClass);
            dailyBtn.classList.remove(...activeClass);
            dailyBtn.classList.add(...inactiveClass);
        }
        loadDashboard();
    }

    // ── 일별 탐색 ─────────────────────────────────────────────
    function changeDate(delta) {
        const [y, m, d] = currentDate.split('-').map(Number);
        const next = new Date(Date.UTC(y, m - 1, d + delta)).toISOString().slice(0, 10);
        if (next > todayKST()) return;
        currentDate = next;
        updateDateUI();
        loadDashboard();
    }

    function updateDateUI() {
        const [y, m, d] = currentDate.split('-').map(Number);
        const dt = new Date(Date.UTC(y, m - 1, d));
        const isToday = currentDate === todayKST();
        document.getElementById('dateDisplay').textContent =
            dt.toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', timeZone: 'UTC' });
        document.getElementById('dateSubDisplay').textContent =
            dt.toLocaleDateString('ko-KR', { weekday: 'long', timeZone: 'UTC' }) + (isToday ? ' · 오늘' : '');
        document.getElementById('nextDateBtn').disabled = isToday;
        document.getElementById('nextDateBtn').style.opacity = isToday ? '0.3' : '1';
    }

    // ── 주간 탐색 ─────────────────────────────────────────────
    function changeWeek(delta) {
        const [y, m, d] = currentWeek.split('-').map(Number);
        const next = new Date(Date.UTC(y, m - 1, d + delta * 7)).toISOString().slice(0, 10);
        const thisMonday = mondayOfWeek(todayKST());
        if (next > thisMonday) return;
        currentWeek = next;
        updateWeekUI();
        loadDashboard();
    }

    function updateWeekUI() {
        const [wy, wm, wd] = currentWeek.split('-').map(Number);
        const mon = new Date(Date.UTC(wy, wm - 1, wd));
        const sun = new Date(Date.UTC(wy, wm - 1, wd + 6));
        const fmt = d => d.toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', timeZone: 'UTC' });
        const thisMonday = mondayOfWeek(todayKST());
        const isThisWeek = currentWeek === thisMonday;
        document.getElementById('weekDisplay').textContent = `${fmt(mon)} ~ ${fmt(sun)}`;
        document.getElementById('weekSubDisplay').textContent =
            wy + '년' + (isThisWeek ? ' · 이번 주' : '');
        document.getElementById('nextWeekBtn').disabled = isThisWeek;
        document.getElementById('nextWeekBtn').style.opacity = isThisWeek ? '0.3' : '1';
    }

    // ── 인증 ──────────────────────────────────────────────────
    let gatePin = '';

    function checkSession() {
        try {
            const raw = sessionStorage.getItem('adminSession');
            if (!raw) return false;
            const { exp } = JSON.parse(raw);
            return Date.now() < exp;
        } catch { return false; }
    }

    function showDashboard() {
        document.getElementById('pinGate').classList.add('hidden');
        document.getElementById('mainContent').classList.remove('hidden');
        updateDateUI();
        updateWeekUI();
        // 일별 뷰 초기 스타일
        document.getElementById('viewDailyBtn').classList.add('bg-orange-500', 'text-white', 'shadow-sm');
        document.getElementById('viewWeeklyBtn').classList.add('text-slate-500');
        loadDashboard();
    }

    function logout() {
        sessionStorage.removeItem('adminSession');
        gatePin = '';
        updateGateDots();
        document.getElementById('pinGate').classList.remove('hidden');
        document.getElementById('mainContent').classList.add('hidden');
    }

    function gateKey(digit) {
        if (gatePin.length >= 4) return;
        gatePin += digit;
        updateGateDots();
        if (gatePin.length === 4) setTimeout(doLogin, 120);
    }

    function gateBackspace() {
        gatePin = gatePin.slice(0, -1);
        updateGateDots();
        document.getElementById('gateError').classList.add('hidden');
    }

    function updateGateDots() {
        document.querySelectorAll('#gatePinDots .pin-dot').forEach((dot, i) => {
            if (i < gatePin.length) {
                dot.classList.add('filled');
                dot.style.borderColor = '#9d4300';
            } else {
                dot.classList.remove('filled');
                dot.style.borderColor = '';
            }
        });
    }

    async function doLogin() {
        try {
            await API.teacherLogin(gatePin);
            sessionStorage.setItem('adminSession', JSON.stringify({ exp: Date.now() + 30 * 60 * 1000 }));
            showDashboard();
        } catch (e) {
            document.getElementById('gateError').textContent = e.message || 'PIN이 올바르지 않습니다';
            document.getElementById('gateError').classList.remove('hidden');
            document.getElementById('gatePinDots').classList.add('shake');
            setTimeout(() => document.getElementById('gatePinDots').classList.remove('shake'), 400);
            gatePin = '';
            updateGateDots();
        }
    }

    // ── 대시보드 ───────────────────────────────────────────────
    async function loadDashboard() {
        if (currentView === 'weekly') return loadWeeklySummary();

        const list = document.getElementById('studentList');
        list.innerHTML = '<div class="text-center py-10 text-slate-400 text-sm">불러오는 중...</div>';
        ['statTotal','statCompleted','statAvgPct'].forEach(id => document.getElementById(id).textContent = '—');

        try {
            const students = await API.getStudents();
            if (!students.length) {
                list.innerHTML = '<div class="text-center py-10 text-slate-400 text-sm">등록된 학생이 없습니다.</div>';
                return;
            }

            const allResults = await Promise.all(
                students.map(async s => ({ student: s, ...(await API.getResultsByDate(s.id, currentDate)) }))
            );

            const completed = allResults.filter(r => r.session?.completed).length;
            const started   = allResults.filter(r => r.session);
            const avgPct    = started.length === 0 ? null
                : Math.round(started.reduce((sum, r) => {
                    const t = r.session.cards_target || 10;
                    return sum + (r.session.cards_drawn / t * 100);
                }, 0) / started.length);

            document.getElementById('statTotal').textContent     = students.length;
            document.getElementById('statCompleted').textContent = completed;
            document.getElementById('statAvgPct').textContent    = avgPct !== null ? avgPct + '%' : '—';

            renderList(allResults);
        } catch (e) {
            list.innerHTML = `<div class="text-center py-10 text-red-400 text-sm">로드 실패: ${escHtml(e.message)}</div>`;
        }
    }

    async function loadWeeklySummary() {
        const list = document.getElementById('studentList');
        list.innerHTML = '<div class="text-center py-10 text-slate-400 text-sm">불러오는 중...</div>';
        ['statTotal','statAvgPct'].forEach(id => document.getElementById(id).textContent = '—');

        try {
            const data = await API.getAdminWeeklySummary(currentWeek);
            const { students, weekStart } = data;

            // 통계: 주간 7일 중 1일이라도 완료한 학생 수
            const activeCount = students.filter(r => r.week.some(d => d && !d.future && d.completed)).length;
            document.getElementById('statTotal').textContent  = students.length;
            document.getElementById('statAvgPct').textContent = activeCount + '명 활성';

            renderWeeklyList(students, weekStart);
        } catch (e) {
            list.innerHTML = `<div class="text-center py-10 text-red-400 text-sm">로드 실패: ${escHtml(e.message)}</div>`;
        }
    }

    function renderWeeklyList(students, weekStart) {
        const list = document.getElementById('studentList');
        const DOW = ['월', '화', '수', '목', '금', '토', '일'];

        // 헤더 행 (요일)
        const header = `
        <div class="flex items-center gap-2 px-5 py-2 border-b border-slate-100 dark:border-slate-800 bg-slate-50/60 dark:bg-slate-800/30">
            <div class="w-9 flex-shrink-0"></div>
            <div class="w-20 sm:w-28 flex-shrink-0"></div>
            <div class="flex flex-1 gap-1">
                ${DOW.map(d => `<div class="flex-1 text-center text-xs font-bold text-slate-400">${d}</div>`).join('')}
            </div>
            <div class="w-14 flex-shrink-0 text-right text-xs font-bold text-slate-400">합계</div>
        </div>`;

        const rows = students.map(({ student, week }) => {
            const totalDrawn  = week.filter(d => d && !d.future).reduce((s, d) => s + (d.cards_drawn || 0), 0);
            const completedDays = week.filter(d => d && !d.future && d.completed).length;

            const cells = week.map((day, i) => {
                if (!day || day.future) {
                    return `<div class="flex-1 flex items-center justify-center">
                        <div class="w-7 h-7 rounded-full border-2 border-dashed border-slate-200 dark:border-slate-700"></div>
                    </div>`;
                }
                if (day.not_started) {
                    return `<div class="flex-1 flex items-center justify-center">
                        <div class="w-7 h-7 rounded-full border-2 border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900"></div>
                    </div>`;
                }
                const pct = Math.min(100, Math.round((day.cards_drawn / (day.cards_target || 10)) * 100));
                if (day.completed) {
                    return `<div class="flex-1 flex items-center justify-center" title="${day.date}: ${day.cards_drawn}개 완료">
                        <div class="w-7 h-7 rounded-full bg-green-500 flex items-center justify-center shadow-sm">
                            <span class="material-symbols-outlined text-white text-sm" style="font-variation-settings:'FILL' 1;font-size:14px">check</span>
                        </div>
                    </div>`;
                }
                // 진행 중: 파이 느낌의 원형 진행률
                const deg = Math.round(pct * 3.6);
                return `<div class="flex-1 flex items-center justify-center" title="${day.date}: ${day.cards_drawn}/${day.cards_target}개">
                    <div class="w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold text-orange-600 dark:text-orange-400"
                        style="background: conic-gradient(#fb923c ${deg}deg, #e2e8f0 ${deg}deg)">
                        <div class="w-5 h-5 rounded-full bg-white dark:bg-slate-900 flex items-center justify-center text-[9px] font-bold text-orange-600">${pct}</div>
                    </div>
                </div>`;
            }).join('');

            const summaryColor = completedDays >= 5 ? 'text-green-600' : completedDays >= 3 ? 'text-orange-500' : 'text-slate-400';
            return `
            <div class="flex items-center gap-2 px-5 py-3 hover:bg-slate-50 dark:hover:bg-slate-800/40 transition-colors border-b border-slate-100 dark:border-slate-800 last:border-0">
                <div class="w-9 h-9 rounded-full bg-orange-100 dark:bg-orange-900/20 text-orange-600 flex items-center justify-center font-black text-sm flex-shrink-0">${escHtml(student.name.charAt(0))}</div>
                <span class="font-bold text-sm w-20 sm:w-28 flex-shrink-0 truncate">${escHtml(student.name)}</span>
                <div class="flex flex-1 gap-1">${cells}</div>
                <div class="w-14 flex-shrink-0 text-right">
                    <p class="text-xs font-black ${summaryColor}">${completedDays}/7일</p>
                    <p class="text-xs text-slate-400">${totalDrawn}개</p>
                </div>
            </div>`;
        }).join('');

        list.innerHTML = header + rows || '<div class="text-center py-10 text-slate-400 text-sm">등록된 학생이 없습니다.</div>';
    }

    function renderList(allResults) {
        const list = document.getElementById('studentList');
        list.innerHTML = allResults.map((r, idx) => {
            const { student, session, cards } = r;
            const success    = (cards || []).filter(c => c.result === 'success');
            const fail       = (cards || []).filter(c => c.result === 'fail');
            const drawn      = session?.cards_drawn ?? 0;
            const target     = session?.cards_target ?? 10;
            const pct        = target > 0 ? Math.round(drawn / target * 100) : 0;
            const notStarted = !session;

            const cardRow = (c, type) => {
                const isSuccess = type === 'success';
                const bg   = isSuccess ? 'bg-green-50 dark:bg-green-900/10' : 'bg-red-50 dark:bg-red-900/10';
                const chip = isSuccess
                    ? 'text-green-700 dark:text-green-400 bg-green-100 dark:bg-green-900/30'
                    : 'text-red-600 dark:text-red-400 bg-red-100 dark:bg-red-900/30';
                const resetBtn = (!isSuccess && c.cards?.id) ? `
                    <button onclick="resetBox('${escHtml(c.cards.id)}')"
                        class="ml-1 text-xs px-2 py-1 rounded-lg bg-orange-100 dark:bg-orange-900/20 text-orange-600 font-bold hover:bg-orange-200 transition-all active:scale-95 flex items-center gap-0.5 flex-shrink-0">
                        <span class="material-symbols-outlined text-xs">restart_alt</span>Box 1
                    </button>` : '';
                return `
                <div class="flex items-center gap-2 px-3 py-2 rounded-xl ${bg}">
                    <span class="text-xs font-bold ${chip} px-2 py-0.5 rounded-full flex-shrink-0 max-w-[72px] truncate">${escHtml(c.cards?.topic || '?')}</span>
                    <span class="text-xs text-slate-600 dark:text-slate-400 flex-1 truncate">${escHtml(c.cards?.question || '')}</span>
                    <span class="text-xs text-slate-400 font-mono flex-shrink-0">Box ${c.box_before}→${c.box_after}</span>
                    ${resetBtn}
                </div>`;
            };

            const detail = notStarted
                ? '<p class="text-sm text-slate-400 text-center py-6">이 날 학습 기록이 없습니다.</p>'
                : `${success.length ? `
                    <p class="text-xs font-bold text-green-600 pt-3 pb-1.5 flex items-center gap-1">
                        <span class="material-symbols-outlined text-sm" style="font-variation-settings:'FILL' 1">check_circle</span>맞춘 카드 (${success.length}개)
                    </p>${success.map(c => cardRow(c, 'success')).join('')}` : ''}
                  ${fail.length ? `
                    <p class="text-xs font-bold text-red-500 pt-3 pb-1.5 flex items-center gap-1">
                        <span class="material-symbols-outlined text-sm" style="font-variation-settings:'FILL' 1">cancel</span>틀린 카드 (${fail.length}개)
                    </p>${fail.map(c => cardRow(c, 'fail')).join('')}` : ''}
                  ${!success.length && !fail.length ? '<p class="text-sm text-slate-400 text-center py-6">기록된 카드가 없습니다.</p>' : ''}`;

            return `
            <div>
                <button onclick="toggleDetail(${idx})"
                    class="w-full flex items-center gap-3 px-5 py-4 hover:bg-slate-50 dark:hover:bg-slate-800/40 transition-colors text-left">
                    <div class="w-9 h-9 rounded-full bg-orange-100 dark:bg-orange-900/20 text-orange-600 flex items-center justify-center font-black text-sm flex-shrink-0">${escHtml(student.name.charAt(0))}</div>
                    <span class="font-bold text-sm w-16 sm:w-24 flex-shrink-0 truncate">${escHtml(student.name)}</span>
                    ${notStarted
                        ? `<span class="text-xs text-slate-400 flex items-center gap-1 flex-1">
                               <span class="material-symbols-outlined text-sm">schedule</span>아직 시작 안 함
                           </span>`
                        : `<div class="flex items-center gap-2 sm:gap-3 flex-1 min-w-0">
                               <span class="text-xs font-bold text-slate-500 flex-shrink-0">${drawn}/${target}</span>
                               <span class="text-xs font-bold text-green-600 flex items-center gap-0.5 flex-shrink-0">
                                   <span class="material-symbols-outlined text-xs" style="font-variation-settings:'FILL' 1">check_circle</span>${success.length}
                               </span>
                               <span class="text-xs font-bold text-red-500 flex items-center gap-0.5 flex-shrink-0">
                                   <span class="material-symbols-outlined text-xs" style="font-variation-settings:'FILL' 1">cancel</span>${fail.length}
                               </span>
                               <div class="flex-1 h-1.5 rounded-full bg-slate-200 dark:bg-slate-700 hidden sm:block min-w-0">
                                   <div class="h-1.5 rounded-full" style="width:${pct}%;background:linear-gradient(to right,#fb923c,#22c55e)"></div>
                               </div>
                               <span class="text-xs font-bold text-slate-400 flex-shrink-0">${pct}%</span>
                               ${session?.completed ? `<span class="material-symbols-outlined text-green-500 text-lg flex-shrink-0" style="font-variation-settings:'FILL' 1">task_alt</span>` : ''}
                           </div>`
                    }
                    <span class="material-symbols-outlined text-slate-300 text-sm flex-shrink-0 transition-transform duration-200" id="chevron-${idx}">expand_more</span>
                </button>
                <div id="detail-${idx}" class="hidden px-5 pb-4 space-y-2 bg-slate-50/50 dark:bg-slate-800/20">
                    ${detail}
                </div>
            </div>`;
        }).join('');
    }

    function toggleDetail(idx) {
        const detail  = document.getElementById(`detail-${idx}`);
        const chevron = document.getElementById(`chevron-${idx}`);
        const opening = detail.classList.contains('hidden');
        detail.classList.toggle('hidden');
        chevron.classList.toggle('chevron-open', opening);
    }

    function showToast(msg, isError = false) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.style.background = isError ? '#ba1a1a' : '#1a6b3c';
        t.classList.remove('hidden');
        setTimeout(() => t.classList.add('hidden'), 2500);
    }

    async function resetBox(cardId) {
        if (!confirm('이 카드를 Box 1로 초기화할까요?')) return;
        try {
            await API.updateCard(cardId, { box: 1 });
            showToast('Box 1로 초기화되었습니다');
            loadDashboard();
        } catch (e) {
            showToast(e.message, true);
        }
    }

    // ── 초기화 ─────────────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', () => {
        if (window.matchMedia('(prefers-color-scheme: dark)').matches)
            document.documentElement.classList.add('dark');
        checkSession() ? showDashboard() : document.getElementById('pinGate').classList.remove('hidden');
    });

    window.addEventListener('unhandledrejection', e => {
        if (e.reason?.message?.includes('선생님 인증')) {
            showToast('세션 만료. 다시 로그인해주세요', true);
            setTimeout(logout, 1500);
        }
    });
</script>
</body>
</html>
