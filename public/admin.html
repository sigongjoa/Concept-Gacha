<!DOCTYPE html>
<html lang="ko" class="light">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>개념 가챠 - 관리자</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'surface':                    '#f7f9fb',
                        'surface-container-lowest':   '#ffffff',
                        'surface-container-low':      '#f2f4f6',
                        'surface-container':          '#eceef0',
                        'surface-container-high':     '#e6e8ea',
                        'primary':                    '#9d4300',
                        'primary-container':          '#f97316',
                        'primary-fixed':              '#ffdbca',
                        'on-primary':                 '#ffffff',
                        'on-primary-container':       '#582200',
                        'secondary':                  '#4648d4',
                        'secondary-fixed':            '#e1e0ff',
                        'on-secondary':               '#ffffff',
                        'tertiary':                   '#006c49',
                        'tertiary-container':         '#00b07a',
                        'on-tertiary':                '#ffffff',
                        'error':                      '#ba1a1a',
                        'error-container':            '#ffdad6',
                        'on-error':                   '#ffffff',
                        'on-error-container':         '#93000a',
                        'on-surface':                 '#191c1e',
                        'on-surface-variant':         '#584237',
                        'outline':                    '#8c7164',
                        'outline-variant':            '#e0c0b1',
                    },
                    fontFamily: {
                        'headline': ['Plus Jakarta Sans', 'Noto Sans KR', 'sans-serif'],
                        'body':     ['Inter', 'Noto Sans KR', 'sans-serif'],
                    },
                    borderRadius: {
                        'DEFAULT': '0.75rem', 'lg': '1rem', 'xl': '1.25rem', '2xl': '1.5rem', 'full': '9999px',
                    },
                },
            },
        };
    </script>
    <style>
        body { font-family: 'Inter', 'Noto Sans KR', sans-serif; }
        .key-btn { transition: transform 0.08s, background 0.08s; user-select: none; }
        .key-btn:active { transform: scale(0.92); }
        .pin-dot { transition: background 0.15s, transform 0.15s; }
        .pin-dot.filled { background: #9d4300; transform: scale(1.15); }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-6px); }
            80% { transform: translateX(6px); }
        }
        .shake { animation: shake 0.4s ease; }
    </style>
</head>

<body class="bg-surface dark:bg-on-surface text-on-surface dark:text-surface min-h-screen">

    <!-- ── Teacher PIN Gate Overlay ──────────────────────────── -->
    <div id="pinGate" class="fixed inset-0 z-50 bg-surface flex items-center justify-center p-4">
        <div class="w-full max-w-xs bg-surface-container-lowest rounded-2xl shadow-2xl overflow-hidden border border-outline-variant/30">
            <!-- Header -->
            <div class="px-6 pt-6 pb-4 text-center">
                <div class="inline-flex items-center justify-center w-12 h-12 rounded-full mb-3 bg-primary">
                    <span class="material-symbols-outlined text-on-primary text-xl" style="font-variation-settings:'FILL' 1" aria-hidden="true">shield_person</span>
                </div>
                <h1 class="font-headline font-bold text-lg text-on-surface">선생님 인증</h1>
                <p class="text-on-surface-variant text-xs mt-1">4자리 PIN을 입력하세요</p>
            </div>

            <!-- PIN dots -->
            <div id="gatePinDots" class="flex justify-center gap-4 py-3"
                 role="status" aria-live="polite" aria-label="PIN 0자리 입력됨">
                <div class="pin-dot w-4 h-4 rounded-full border-2 border-outline-variant"></div>
                <div class="pin-dot w-4 h-4 rounded-full border-2 border-outline-variant"></div>
                <div class="pin-dot w-4 h-4 rounded-full border-2 border-outline-variant"></div>
                <div class="pin-dot w-4 h-4 rounded-full border-2 border-outline-variant"></div>
            </div>

            <!-- Error -->
            <div id="gateError" class="hidden mx-5 mb-3 px-3 py-2 rounded-DEFAULT bg-error-container text-on-error-container text-xs font-bold text-center" role="alert"></div>

            <!-- Keypad -->
            <div class="px-5 pb-5">
                <div class="grid grid-cols-3 gap-2" id="gateKeypad" role="group" aria-label="숫자 키패드">
                    <button class="key-btn h-12 rounded-DEFAULT bg-surface-container-low hover:bg-surface-container font-bold text-lg text-on-surface focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary" data-gate-key="1">1</button>
                    <button class="key-btn h-12 rounded-DEFAULT bg-surface-container-low hover:bg-surface-container font-bold text-lg text-on-surface focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary" data-gate-key="2">2</button>
                    <button class="key-btn h-12 rounded-DEFAULT bg-surface-container-low hover:bg-surface-container font-bold text-lg text-on-surface focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary" data-gate-key="3">3</button>
                    <button class="key-btn h-12 rounded-DEFAULT bg-surface-container-low hover:bg-surface-container font-bold text-lg text-on-surface focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary" data-gate-key="4">4</button>
                    <button class="key-btn h-12 rounded-DEFAULT bg-surface-container-low hover:bg-surface-container font-bold text-lg text-on-surface focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary" data-gate-key="5">5</button>
                    <button class="key-btn h-12 rounded-DEFAULT bg-surface-container-low hover:bg-surface-container font-bold text-lg text-on-surface focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary" data-gate-key="6">6</button>
                    <button class="key-btn h-12 rounded-DEFAULT bg-surface-container-low hover:bg-surface-container font-bold text-lg text-on-surface focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary" data-gate-key="7">7</button>
                    <button class="key-btn h-12 rounded-DEFAULT bg-surface-container-low hover:bg-surface-container font-bold text-lg text-on-surface focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary" data-gate-key="8">8</button>
                    <button class="key-btn h-12 rounded-DEFAULT bg-surface-container-low hover:bg-surface-container font-bold text-lg text-on-surface focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary" data-gate-key="9">9</button>
                    <div aria-hidden="true"></div>
                    <button class="key-btn h-12 rounded-DEFAULT bg-surface-container-low hover:bg-surface-container font-bold text-lg text-on-surface focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary" data-gate-key="0">0</button>
                    <button class="key-btn h-12 rounded-DEFAULT bg-surface-container-low hover:bg-surface-container flex items-center justify-center text-outline focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary" data-gate-key="backspace" aria-label="지우기">
                        <span class="material-symbols-outlined text-lg" aria-hidden="true">backspace</span>
                    </button>
                </div>
            </div>
            <div class="px-5 pb-5 text-center">
                <a href="index.html" class="text-xs text-outline hover:text-on-surface-variant transition-colors focus-visible:outline-none focus-visible:underline">
                    ← 학생 로그인 페이지로
                </a>
            </div>
        </div>
    </div>

    <!-- ── Toast ──────────────────────────────────────────────── -->
    <div id="toast" class="fixed top-4 right-4 z-40 hidden px-4 py-3 rounded-xl text-sm font-bold shadow-lg text-white"></div>

    <!-- ── Main Content ───────────────────────────────────────── -->

        <div class="max-w-4xl mx-auto p-6 lg:p-10">

            <!-- Header -->
            <div class="flex justify-between items-center mb-8">
                <div>
                    <p class="text-xs font-bold text-primary uppercase tracking-widest mb-1">Admin</p>
                    <h1 class="font-headline text-2xl font-black text-on-surface">관리자 대시보드</h1>
                </div>
                <div class="flex items-center gap-2">
                    <a href="admin-dashboard.html"
                        class="flex items-center gap-1.5 px-3 py-2 rounded-xl text-sm font-bold transition-all active:scale-95 bg-primary text-on-primary hover:bg-primary/90 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary">
                        <span class="material-symbols-outlined text-sm" style="font-variation-settings:'FILL' 1" aria-hidden="true">bar_chart</span>
                        학습 현황
                    </a>
                    <button id="darkModeBtn"

                    <button id="logoutBtn"

            </div>

            <div class="grid grid-cols-1 xl:grid-cols-2 gap-6">

                <!-- ── Student Management ──────────────────────── -->

                    <h2 class="font-headline text-base font-bold mb-4 flex items-center gap-2 text-on-surface"
                        <span class="material-symbols-outlined text-primary text-xl" style="font-variation-settings:'FILL' 1" aria-hidden="true">group</span>
                        학생 관리

                    <div class="space-y-3" id="adminStudentList">
                        <div class="text-center py-8 text-outline text-sm">학생 목록을 불러오는 중...</div>

                    <!-- Add Student -->
                    <div class="flex gap-2 mt-4 pt-4 border-t border-outline-variant/30">
                        <label for="newStudentNameInput" class="sr-only">새 학생 이름</label>
                        <input
                            type="text"
                            id="newStudentNameInput"
                            placeholder="새 학생 이름"

                        />
                        <button id="addStudentBtn"
                            class="px-4 py-2.5 rounded-DEFAULT bg-primary text-on-primary font-bold text-sm transition-all active:scale-95 hover:bg-primary/90 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary">

                        </button>

                <!-- ── Card Management ─────────────────────────── -->
                <section class="bg-surface-container-lowest rounded-2xl p-6 shadow-[0px_4px_20px_rgba(88,66,55,0.09)] border border-outline-variant/30">

                        <h2 class="text-base font-bold flex items-center gap-2">

                            카드 관리

                        <select id="studentFilter"
                            class="bg-surface-container-low border-none rounded-DEFAULT text-sm p-2 outline-none text-on-surface focus-visible:ring-2 focus-visible:ring-primary">

                    </div>

                <!-- ── PIN Management ──────────────────────────── -->

                    <div class="space-y-3" id="pinStudentList">
                        <div class="text-center py-8 text-outline text-sm">학생 목록을 불러오는 중...</div>
                    </div>
                </section>

                <!-- ── Teacher PIN Change ──────────────────────── -->
                <section class="bg-surface-container-lowest rounded-2xl p-6 shadow-[0px_4px_20px_rgba(88,66,55,0.09)] border border-outline-variant/30">
                    <h2 class="font-headline text-base font-bold mb-4 flex items-center gap-2 text-on-surface"

                        선생님 PIN 변경

                    <p class="text-xs text-outline mb-4">현재 PIN: <span id="currentPinMask">••••</span></p>

                <!-- ── Today's Learning Dashboard ─────────────── -->
                <section class="xl:col-span-2 bg-surface-container-lowest rounded-2xl p-6 shadow-[0px_4px_20px_rgba(88,66,55,0.09)] border border-outline-variant/30">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="font-headline text-base font-bold flex items-center gap-2 text-on-surface">
                            <span class="material-symbols-outlined text-tertiary text-xl" style="font-variation-settings:'FILL' 1" aria-hidden="true">bar_chart</span>
                            오늘의 학습 현황
                            <span id="todayDateBadge" class="text-xs font-normal text-outline ml-1"></span>
                        </h2>
                        <button id="refreshBtn" class="p-2 rounded-full hover:bg-surface-container-low transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary" aria-label="새로고침">
                            <span class="material-symbols-outlined text-outline text-xl" aria-hidden="true">refresh</span>
                        </button>
                    </div>
                    <div class="space-y-2" id="todayResultsList">
                        <div class="text-center py-8 text-outline text-sm">학습 현황을 불러오는 중...</div>

                </section>

            </div>
        </div>

    <script type="module" src="js/api.js"></script>
    <script src="js/layout.js"></script>
    <script>
        // ── HTML 이스케이프 (XSS 방지) ────────────────────────────
        function escHtml(str) {
            return String(str ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // ── PIN Gate ──────────────────────────────────────────────
        let gatePin = '';
        let teacherToken = '';

        function gateKey(digit) {
            if (gatePin.length >= 4) return;
            gatePin += digit;
            updateGateDots();
            if (gatePin.length === 4) setTimeout(doTeacherLogin, 120);
        }

        function gateBackspace() {
            gatePin = gatePin.slice(0, -1);
            updateGateDots();
            document.getElementById('gateError').classList.add('hidden');
        }

        function updateGateDots() {
            const dots = document.querySelectorAll('#gatePinDots .pin-dot');
            dots.forEach((dot, i) => {
                if (i < gatePin.length) dot.classList.add('filled');
                else dot.classList.remove('filled');
            });
            document.getElementById('gatePinDots').setAttribute('aria-label', `PIN ${gatePin.length}자리 입력됨`);
        }

        // Event delegation for gate keypad
        document.getElementById('gateKeypad').addEventListener('click', (e) => {
            const btn = e.target.closest('[data-gate-key]');
            if (!btn) return;
            const key = btn.dataset.gateKey;
            if (key === 'backspace') gateBackspace();
            else gateKey(key);
        });

        async function doTeacherLogin() {
            try {
                const res = await API.teacherLogin(gatePin);
                teacherToken = res.token;
                sessionStorage.setItem('adminSession', JSON.stringify({ exp: Date.now() + 30 * 60 * 1000 }));
                document.getElementById('pinGate').classList.add('hidden');
                document.getElementById('mainContent').classList.remove('hidden');
                initAdmin();
            } catch (e) {
                const errEl = document.getElementById('gateError');
                errEl.textContent = e.message || 'PIN이 올바르지 않습니다';
                errEl.classList.remove('hidden');
                const dots = document.getElementById('gatePinDots');
                dots.classList.add('shake');
                setTimeout(() => dots.classList.remove('shake'), 400);
                gatePin = '';
                updateGateDots();
            }
        }

        function logout() {
            teacherToken = '';
            gatePin = '';
            sessionStorage.removeItem('adminSession');
            updateGateDots();
            document.getElementById('pinGate').classList.remove('hidden');
            document.getElementById('mainContent').classList.add('hidden');
        }

        // ── Toast ─────────────────────────────────────────────────
        function showToast(msg, isError = false) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = `fixed top-4 right-4 z-40 px-4 py-3 rounded-xl text-sm font-bold shadow-lg text-white ${isError ? 'bg-error' : 'bg-tertiary'}`;
            t.classList.remove('hidden');
            setTimeout(() => t.classList.add('hidden'), 2500);
        }

        // ── Admin Logic ───────────────────────────────────────────
        function initAdmin() {
            Layout.init();
            loadAllStudents();
            loadTodayResults();

            document.getElementById('darkModeBtn').addEventListener('click', () =>
                document.documentElement.classList.toggle('dark'));
            document.getElementById('logoutBtn').addEventListener('click', logout);
            document.getElementById('refreshBtn').addEventListener('click', loadTodayResults);
            document.getElementById('addStudentBtn').addEventListener('click', addStudent);
            document.getElementById('changePinBtn').addEventListener('click', changeTeacherPin);
            document.getElementById('newStudentNameInput').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') addStudent();
            });

            document.getElementById('studentFilter').addEventListener('change', (e) => {
                const sid = e.target.value;
                if (sid) loadStudentCards(sid);
                else document.getElementById('adminCardList').innerHTML = '<div class="text-center py-8 text-outline text-sm">학생을 선택하여 카드를 관리하세요.</div>';
            });
            // 오늘 날짜 배지
            document.getElementById('todayDateBadge').textContent =
                new Date().toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'short' });
        }

        // ── 오늘의 학습 현황 ──────────────────────────────────────
        async function loadTodayResults() {
            const container = document.getElementById('todayResultsList');
            container.innerHTML = '<div class="text-center py-8 text-outline text-sm">불러오는 중...</div>';
            try {
                const students = await API.getStudents();
                if (students.length === 0) {
                    container.innerHTML = '<div class="text-center py-8 text-outline text-sm">등록된 학생이 없습니다.</div>';
                    return;
                }
                const allResults = await Promise.all(
                    students.map(async s => ({ student: s, ...(await API.getTodayResults(s.id)) }))
                );
                renderTodayDashboard(allResults);
            } catch (e) {
                container.innerHTML = `<div class="text-center py-8 text-red-400 text-sm">로드 실패: ${escHtml(e.message)}</div>`;
            }
        }

        function renderTodayDashboard(allResults) {
            const container = document.getElementById('todayResultsList');
            container.innerHTML = allResults.map((r, idx) => {
                const { student, session, cards } = r;
                const success = (cards || []).filter(c => c.result === 'success');
                const fail    = (cards || []).filter(c => c.result === 'fail');
                const drawn   = session ? session.cards_drawn : 0;
                const target  = session ? session.cards_target : 10;
                const pct     = target > 0 ? Math.round(drawn / target * 100) : 0;
                const notStarted = !session;

                const successRows = success.map(c => `
                    <div class="flex items-center gap-2 px-3 py-2 rounded-lg bg-green-50 dark:bg-green-900/10">
                        <span class="text-xs font-bold text-green-700 dark:text-green-400 bg-green-100 dark:bg-green-900/30 px-2 py-0.5 rounded-full flex-shrink-0">${escHtml(c.cards?.topic || '?')}</span>
                        <span class="text-xs text-on-surface-variant flex-1 truncate">${escHtml(c.cards?.question || '')}</span>
                        <span class="text-xs text-outline flex-shrink-0 font-mono">Box ${c.box_before}→${c.box_after}</span>
                    </div>`).join('');

                const failRows = fail.map(c => `
                    <div class="flex items-center gap-2 px-3 py-2 rounded-lg bg-red-50 dark:bg-red-900/10">
                        <span class="text-xs font-bold text-red-600 dark:text-red-400 bg-red-100 dark:bg-red-900/30 px-2 py-0.5 rounded-full flex-shrink-0">${escHtml(c.cards?.topic || '?')}</span>
                        <span class="text-xs text-on-surface-variant flex-1 truncate">${escHtml(c.cards?.question || '')}</span>
                        <span class="text-xs text-outline flex-shrink-0 font-mono">Box ${c.box_before}→${c.box_after}</span>
                        ${c.cards?.id ? `
                        <button onclick="resetCardBox('${escHtml(c.cards.id)}')"
                            class="text-xs px-2 py-1 rounded-lg bg-orange-100 dark:bg-orange-900/20 text-orange-600 dark:text-orange-400 font-bold hover:bg-orange-200 dark:hover:bg-orange-900/40 transition-all active:scale-95 flex-shrink-0 flex items-center gap-0.5">
                            <span class="material-symbols-outlined text-xs">restart_alt</span>Box 1
                        </button>` : ''}
                    </div>`).join('');

                return `
                <div class="rounded-xl border border-outline-variant/30 overflow-hidden">
                    <button onclick="toggleStudentDetail(${idx})"
                        class="w-full flex items-center gap-3 px-4 py-3 bg-surface-container-low hover:bg-surface-container transition-colors text-left focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary rounded-xl">
                        <div class="w-8 h-8 rounded-full bg-orange-100 dark:bg-orange-900/20 text-orange-600 flex items-center justify-center font-bold text-sm flex-shrink-0">${escHtml(student.name.charAt(0))}</div>
                        <span class="font-bold text-sm w-20 flex-shrink-0 truncate">${escHtml(student.name)}</span>
                        ${notStarted
                            ? `<span class="text-xs text-outline flex items-center gap-1"><span class="material-symbols-outlined text-sm">schedule</span>아직 시작 안 함</span>`
                            : `<div class="flex items-center gap-3 flex-1 min-w-0">
                                <span class="text-xs font-bold text-on-surface-variant flex-shrink-0">${drawn}/${target}</span>
                                <span class="text-xs font-bold text-green-600 flex items-center gap-0.5 flex-shrink-0">
                                    <span class="material-symbols-outlined text-xs" style="font-variation-settings:'FILL' 1">check_circle</span>${success.length}
                                </span>
                                <span class="text-xs font-bold text-red-500 flex items-center gap-0.5 flex-shrink-0">
                                    <span class="material-symbols-outlined text-xs" style="font-variation-settings:'FILL' 1">cancel</span>${fail.length}
                                </span>
                                <div class="flex-1 h-1.5 rounded-full bg-surface-container-high hidden sm:block min-w-0">
                                    <div class="h-1.5 rounded-full" style="width:${pct}%; background:linear-gradient(to right,#fb923c,#22c55e)"></div>
                                </div>
                                <span class="text-xs text-outline font-bold flex-shrink-0">${pct}%</span>
                                ${session?.completed ? `<span class="material-symbols-outlined text-green-500 text-base flex-shrink-0" style="font-variation-settings:'FILL' 1">task_alt</span>` : ''}
                               </div>`
                        }
                        <span class="material-symbols-outlined text-outline text-sm transition-transform flex-shrink-0" id="chevron-${idx}">expand_more</span>
                    </button>
                    <div id="detail-${idx}" class="hidden px-4 pb-4 pt-2 space-y-1.5 bg-surface-container-lowest">
                        ${notStarted
                            ? '<p class="text-sm text-outline text-center py-4">오늘 학습 기록이 없습니다.</p>'
                            : `${success.length > 0 ? `
                                <p class="text-xs font-bold text-green-600 mt-2 mb-1 flex items-center gap-1">
                                    <span class="material-symbols-outlined text-sm" style="font-variation-settings:'FILL' 1">check_circle</span>맞춘 카드 (${success.length}개)
                                </p>${successRows}` : ''}
                             ${fail.length > 0 ? `
                                <p class="text-xs font-bold text-red-500 mt-3 mb-1 flex items-center gap-1">
                                    <span class="material-symbols-outlined text-sm" style="font-variation-settings:'FILL' 1">cancel</span>틀린 카드 (${fail.length}개)
                                </p>${failRows}` : ''}
                             ${success.length === 0 && fail.length === 0 ? '<p class="text-sm text-outline text-center py-4">기록된 카드가 없습니다.</p>' : ''}`
                        }
                    </div>
                </div>`;
            }).join('');
        }

        function toggleStudentDetail(idx) {
            const detail  = document.getElementById(`detail-${idx}`);
            const chevron = document.getElementById(`chevron-${idx}`);
            const opening = detail.classList.contains('hidden');
            detail.classList.toggle('hidden');
            chevron.style.transform = opening ? 'rotate(180deg)' : '';
        }

        async function resetCardBox(cardId) {
            if (!confirm('이 카드를 Box 1로 초기화할까요?')) return;
            try {
                await API.updateCard(cardId, { box: 1 });
                showToast('Box 1로 초기화되었습니다');
                loadTodayResults();
            } catch (e) {
                showToast(e.message, true);
            }
        }

        async function addStudent() {
            const input = document.getElementById('newStudentNameInput');
            const name = input.value.trim();
            if (!name) return;
            try {
                await API.addStudent(name);
                input.value = '';
                showToast(`${name} 추가됨`);
                loadAllStudents();
            } catch (e) {
                showToast(e.message, true);
            }
        }

        async function loadAllStudents() {
            const list = document.getElementById('adminStudentList');
            const pinList = document.getElementById('pinStudentList');
            const filter = document.getElementById('studentFilter');
            try {
                const students = await API.getStudents();

                list.innerHTML = students.length === 0
                    ? '<div class="text-center py-8 text-outline text-sm">등록된 학생이 없습니다.</div>'
                    : students.map(s => `
                        <div class="flex items-center justify-between p-3 rounded-xl bg-surface-container-low border border-outline-variant/30">
                            <div class="flex items-center gap-3 flex-1 min-w-0">
                                <div class="w-9 h-9 rounded-full bg-orange-100 dark:bg-orange-900/20 text-orange-600 flex items-center justify-center font-bold cursor-pointer hover:scale-110 active:scale-95 transition-all text-sm flex-shrink-0"
                                    data-action="select" data-id="${escHtml(s.id)}">${escHtml(s.name.charAt(0))}</div>
                                <input type="text" value="${escHtml(s.name)}"
                                    data-action="rename" data-id="${escHtml(s.id)}"
                                    class="bg-transparent font-bold border-none outline-none focus:ring-1 focus:ring-orange-300 rounded px-1 text-sm min-w-0 flex-1"/>
                            </div>
                            <div class="flex items-center gap-1 flex-shrink-0">
                                <button data-action="goto" data-id="${escHtml(s.id)}" data-name="${escHtml(s.name)}"
                                    class="flex items-center gap-1 px-2.5 py-1.5 rounded-lg bg-orange-100 dark:bg-orange-900/20 text-orange-600 dark:text-orange-400 text-xs font-bold hover:bg-orange-200 dark:hover:bg-orange-900/40 transition-all active:scale-95">
                                    <span class="material-symbols-outlined text-sm">open_in_new</span>
                                    이동
                                </button>
                                <button data-action="delete" data-id="${escHtml(s.id)}" class="p-1.5 text-outline-variant hover:text-error transition-colors">
                                    <span class="material-symbols-outlined text-xl">delete</span>
                                </button>
                            </div>
                        </div>
                    `).join('');

                pinList.innerHTML = students.length === 0
                    ? '<div class="text-center py-8 text-outline text-sm">등록된 학생이 없습니다.</div>'
                    : students.map(s => `
                        <div class="flex items-center gap-3 p-3 rounded-xl bg-surface-container-low border border-outline-variant/30">
                            <div class="w-9 h-9 rounded-full bg-indigo-100 dark:bg-indigo-900/20 text-indigo-600 flex items-center justify-center font-bold text-sm flex-shrink-0">${escHtml(s.name.charAt(0))}</div>
                            <span class="flex-1 font-bold text-sm">${escHtml(s.name)}</span>
                            <input type="password" placeholder="새 PIN" maxlength="4" inputmode="numeric" pattern="\\d{4}"
                                id="pin-${escHtml(s.id)}"
                                class="w-20 px-2 py-1.5 rounded-lg bg-surface-container-low border border-outline-variant/30 outline-none text-sm font-bold tracking-widest text-center focus:ring-2 focus:ring-secondary/30"/>
                            <button data-action="change-pin" data-id="${escHtml(s.id)}"
                                class="px-3 py-1.5 rounded-lg bg-indigo-100 dark:bg-indigo-900/20 text-indigo-700 dark:text-indigo-400 text-xs font-bold hover:bg-indigo-200 dark:hover:bg-indigo-900/40 transition-all active:scale-95">
                                변경
                            </button>
                        </div>
                    `).join('');

                filter.innerHTML = '<option value="">학생 선택</option>' + students.map(s =>
                    `<option value="${escHtml(s.id)}">${escHtml(s.name)}</option>`).join('');

                // 이벤트 위임 (onclick 속성 대신 addEventListener)
                list.addEventListener('click', e => {
                    const btn = e.target.closest('[data-action]');
                    if (!btn) return;
                    const { action, id, name } = btn.dataset;
                    if (action === 'select') selectStudentForCards(id);
                    if (action === 'goto')   goToStudent(id, name);
                    if (action === 'delete') deleteStudent(id);
                });
                list.addEventListener('blur', e => {
                    const input = e.target.closest('[data-action="rename"]');
                    if (input) renameStudent(input.dataset.id, input.value);
                }, true);
                pinList.addEventListener('click', e => {
                    const btn = e.target.closest('[data-action="change-pin"]');
                    if (btn) changeStudentPin(btn.dataset.id);
                });

            } catch (e) {
                list.innerHTML = '<div class="text-center py-8 text-red-400 text-sm">로드 실패</div>';
            }
        }

        function goToStudent(id, name) {
            sessionStorage.setItem('currentStudent', JSON.stringify({ id, name }));
            sessionStorage.setItem('fromAdmin', '1');
            window.location.href = 'gacha.html';
        }

        function selectStudentForCards(sid) {
            document.getElementById('studentFilter').value = sid;
            loadStudentCards(sid);
        }

        async function renameStudent(id, newName) {
            if (!newName.trim()) return;
            try {
                await API.updateStudent(id, newName);
                showToast('이름이 변경되었습니다');
                loadAllStudents();
            } catch (e) {
                showToast(e.message, true);
            }
        }

        async function deleteStudent(id) {
            if (!confirm('학생을 삭제하면 모든 데이터가 사라집니다. 정말 삭제하시겠습니까?')) return;
            try {
                await API.deleteStudent(id);
                showToast('삭제되었습니다');
                loadAllStudents();
                document.getElementById('adminCardList').innerHTML = '<div class="text-center py-8 text-outline text-sm">학생을 선택하여 카드를 관리하세요.</div>';
            } catch (e) {
                showToast('삭제 실패', true);
            }
        }

        async function loadStudentCards(sid) {
            const list = document.getElementById('adminCardList');
            list.innerHTML = '<div class="text-center py-8 text-outline text-sm">카드를 불러오는 중...</div>';
            try {
                const cards = await API.getCards(sid);
                if (cards.length === 0) {
                    list.innerHTML = '<div class="text-center py-8 text-outline text-sm">등록된 카드가 없습니다.</div>';
                    return;
                }
                list.innerHTML = cards.map(c => `
                    <div class="flex items-center gap-3 p-3 rounded-xl bg-surface-container-low border border-outline-variant/30" data-card-id="${escHtml(c.id)}" data-sid="${escHtml(sid)}">
                        <div class="flex-1 min-w-0 space-y-1.5">
                            ${c.type === 'text'
                                ? `<input type="text" value="${escHtml(c.question)}" data-field="question"
                                    class="w-full bg-transparent font-bold border-none outline-none focus:ring-1 focus:ring-tertiary/50 rounded px-1 text-sm"/>`
                                : `<div class="flex items-center gap-2 px-2 py-1 bg-surface-container rounded text-xs text-on-surface-variant font-bold">
                                    <span class="material-symbols-outlined text-xs">image</span> 이미지 질문</div>`
                            }
                            <div class="flex items-center gap-2">
                                <span class="text-xs text-outline font-bold px-1">정답:</span>
                                <input type="text" value="${escHtml(c.answer)}" data-field="answer"
                                    class="flex-1 bg-transparent text-sm border-none outline-none focus:ring-1 focus:ring-teal-300 rounded px-1"/>
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="text-xs text-outline font-bold px-1">오답:</span>
                                <input type="text" value="${escHtml(Array.isArray(c.distractors) ? c.distractors.join(', ') : '')}"
                                    data-field="distractors" placeholder="쉼표로 구분 (비우면 자동생성)"
                                    class="flex-1 bg-transparent text-xs border-none outline-none focus:ring-1 focus:ring-tertiary/50 rounded px-1 text-on-surface-variant"/>
                            </div>
                        </div>
                        <button data-action="delete-card" class="text-outline-variant hover:text-error transition-colors flex-shrink-0">
                            <span class="material-symbols-outlined text-xl">delete</span>
                        </button>
                    </div>
                `).join('');

                // 카드 이벤트 위임
                list.addEventListener('blur', e => {
                    const input = e.target.closest('[data-field]');
                    if (!input) return;
                    const row = input.closest('[data-card-id]');
                    if (!row) return;
                    const field = input.dataset.field;
                    let value = input.value;
                    if (field === 'distractors') {
                        value = value.trim()
                            ? value.split(',').map(s => s.trim()).filter(Boolean)
                            : null;
                    }
                    updateCardContent(row.dataset.cardId, { [field]: value });
                }, true);
                list.addEventListener('click', e => {
                    const btn = e.target.closest('[data-action="delete-card"]');
                    if (!btn) return;
                    const row = btn.closest('[data-card-id]');
                    if (row) deleteCard(row.dataset.cardId, row.dataset.sid);
                });
            } catch (e) {
                list.innerHTML = '<div class="text-center py-8 text-red-400 text-sm">로드 실패</div>';
            }
        }

        async function updateCardContent(cid, data) {
            try {
                await API.updateCard(cid, data);
                showToast('카드가 업데이트되었습니다');
            } catch (e) {
                showToast('업데이트 실패', true);
            }
        }

        async function deleteCard(cid, sid) {
            if (!confirm('정말 삭제하시겠습니까?')) return;
            try {
                await API.deleteCard(cid);
                showToast('삭제되었습니다');
                loadStudentCards(sid);
            } catch (e) {
                showToast('삭제 실패', true);
            }
        }

        async function changeStudentPin(id) {
            const input = document.getElementById(`pin-${id}`);
            const newPin = input.value.trim();
            if (!/^\d{4}$/.test(newPin)) {
                showToast('4자리 숫자를 입력하세요', true);
                return;
            }
            try {
                await API.setStudentPin(id, newPin, teacherToken);
                input.value = '';
                showToast('PIN이 변경되었습니다');
            } catch (e) {
                showToast(e.message, true);
            }
        }

        async function changeTeacherPin() {
            const input = document.getElementById('newTeacherPin');
            const newPin = input.value.trim();
            if (!/^\d{4}$/.test(newPin)) {
                showToast('4자리 숫자를 입력하세요', true);
                return;
            }
            try {
                await API.setTeacherPin(teacherToken, newPin);
                // 토큰은 유지 (PIN 변경해도 현재 세션 유효)
                input.value = '';
                showToast('선생님 PIN이 변경되었습니다');
            } catch (e) {
                showToast(e.message, true);
            }
        }

        // ── Init ──────────────────────────────────────────────────
        // 페이지 로드 시 항상 PIN 게이트 표시 (보안: 토큰 비영속)
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('pinGate').classList.remove('hidden');
            document.getElementById('mainContent').classList.add('hidden');
        });

        // 토큰 만료 시 자동 로그아웃 처리
        window.addEventListener('unhandledrejection', e => {
            if (e.reason?.message?.includes('선생님 인증 필요')) {
                showToast('세션이 만료되었습니다. 다시 로그인해주세요', true);
                setTimeout(logout, 1500);
            }
        });

        if (window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.classList.add('dark');
    </script>
</body>

</html>
