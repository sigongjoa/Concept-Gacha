<!DOCTYPE html>
<html class="light" lang="ko">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>개념 가챠 - 카드 뽑기</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'surface':                    '#f7f9fb',
                        'surface-dim':                '#d8dadc',
                        'surface-container-lowest':   '#ffffff',
                        'surface-container-low':      '#f2f4f6',
                        'surface-container':          '#eceef0',
                        'surface-container-high':     '#e6e8ea',
                        'surface-container-highest':  '#e0e3e5',
                        'primary':                    '#9d4300',
                        'primary-container':          '#f97316',
                        'primary-fixed':              '#ffdbca',
                        'primary-fixed-dim':          '#ffb690',
                        'on-primary':                 '#ffffff',
                        'secondary':                  '#4648d4',
                        'secondary-container':        '#6063ee',
                        'secondary-fixed':            '#e1e0ff',
                        'secondary-fixed-dim':        '#c0c1ff',
                        'on-secondary':               '#ffffff',
                        'on-secondary-container':     '#fffbff',
                        'tertiary':                   '#006c49',
                        'tertiary-container':         '#00b07a',
                        'on-tertiary':                '#ffffff',
                        'on-tertiary-container':      '#003b26',
                        'error':                      '#ba1a1a',
                        'error-container':            '#ffdad6',
                        'on-error-container':         '#93000a',
                        'on-surface':                 '#191c1e',
                        'on-surface-variant':         '#584237',
                        'outline':                    '#8c7164',
                        'outline-variant':            '#e0c0b1',
                        'inverse-surface':            '#2d3133',
                        'inverse-on-surface':         '#eff1f3',
                    },
                    fontFamily: {
                        'headline': ['Plus Jakarta Sans', 'Noto Sans KR', 'sans-serif'],
                        'body':     ['Inter', 'Noto Sans KR', 'sans-serif'],
                        'label':    ['Inter', 'Noto Sans KR', 'sans-serif'],
                    },
                    // 합리적인 라운드 값으로 재정의
                    borderRadius: {
                        'sm':   '4px',
                        'DEFAULT': '8px',
                        'md':   '10px',
                        'lg':   '12px',
                        'xl':   '16px',
                        '2xl':  '20px',
                        'full': '9999px',
                    },
                },
            },
        };
    </script>

    <style>
        body { font-family: 'Inter', 'Noto Sans KR', sans-serif; min-height: max(884px, 100dvh); }
        .font-headline { font-family: 'Plus Jakarta Sans', 'Noto Sans KR', sans-serif; }

        /* ── 글래스 ───────────────────────────────────────── */
        .glass {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        /* ── 키패드 버튼 ─────────────────────────────────── */
        .kp-btn {
            height: 3.25rem;
            border-radius: 8px;
            background: #f2f4f6;
            font-size: 1.2rem;
            font-weight: 700;
            color: #191c1e;
            border: none;
            transition: transform 0.08s, background 0.08s;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .kp-btn:active { transform: scale(0.93); background: #e6e8ea; }
        .kp-del { background: #ffdad6 !important; color: #93000a !important; }
        .kp-del:active { background: #ffb4ab !important; }
        .kp-dot { color: #4648d4; }
        .kp-slash {
            height: 2.75rem;
            background: #e1e0ff !important;
            color: #4648d4 !important;
            font-size: 0.85rem;
            border: 1.5px solid #c0c1ff !important;
        }
        .kp-slash:active { background: #c0c1ff !important; }
        .dark .kp-btn { background: #2d3133; color: #eff1f3; }
        .dark .kp-btn:active { background: #3a3f42; }
        .dark .kp-del { background: #93000a !important; color: #ffdad6 !important; }
        .dark .kp-slash { background: #2f2ebe !important; color: #e1e0ff !important; }

        /* ── 단위·선택·대수·fillblank 버튼 ─────────────── */
        .unit-btn {
            padding: 0.45rem 0.9rem;
            border-radius: 8px;
            border: 1.5px solid #e0c0b1;
            font-size: 0.9rem;
            font-weight: 600;
            color: #584237;
            background: transparent;
            transition: all 0.12s;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .unit-btn.selected { border-color: #4648d4; background: #e1e0ff; color: #4648d4; }
        .dark .unit-btn { border-color: #584237; color: #8c7164; }
        .dark .unit-btn.selected { border-color: #6063ee; background: #2f2ebe; color: #e1e0ff; }

        .alg-btn {
            padding: 0.45rem 0.9rem;
            border-radius: 8px;
            border: 1.5px solid #c0c1ff;
            font-size: 1rem;
            font-weight: 700;
            color: #4648d4;
            background: #e1e0ff;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            transition: transform 0.08s;
        }
        .alg-btn:active { transform: scale(0.92); }
        .alg-op { border-color: #e0c0b1; color: #584237; background: #f2f4f6; }
        .dark .alg-btn { background: #2f2ebe; border-color: #4648d4; color: #e1e0ff; }
        .dark .alg-op { background: #2d3133; border-color: #584237; color: #8c7164; }

        .choice-btn {
            flex: 1;
            padding: 0.875rem;
            border-radius: 10px;
            border: 1.5px solid #e0c0b1;
            font-size: 1.1rem;
            font-weight: 600;
            color: #584237;
            background: transparent;
            transition: all 0.12s;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .choice-btn.selected { border-color: #4648d4; background: #e1e0ff; color: #4648d4; }
        .dark .choice-btn { border-color: #584237; color: #8c7164; }
        .dark .choice-btn.selected { border-color: #6063ee; background: #2f2ebe; color: #e1e0ff; }

        .word-chip {
            padding: 0.35rem 0.75rem;
            border-radius: 8px;
            border: 1.5px solid #c0c1ff;
            font-size: 0.85rem;
            font-weight: 600;
            color: #4648d4;
            background: #e1e0ff;
            touch-action: manipulation;
            transition: all 0.12s;
        }
        .word-chip:active { transform: scale(0.93); }
        .word-chip.used { opacity: 0.3; pointer-events: none; }
        .dark .word-chip { background: #2f2ebe; border-color: #4648d4; color: #e1e0ff; }

        /* MCQ 선택지 버튼 */
        .mcq-btn {
            padding: 0.65rem 0.75rem;
            border-radius: 10px;
            border: 1.5px solid var(--md-sys-color-outline-variant, #cac4d0);
            font-size: 0.875rem;
            font-weight: 600;
            text-align: center;
            background: transparent;
            color: var(--md-sys-color-on-surface-variant, #49454f);
            transition: all 0.15s;
            touch-action: manipulation;
            cursor: pointer;
            word-break: keep-all;
            line-height: 1.3;
        }
        .mcq-btn:hover:not(:disabled) {
            border-color: #4648d4;
            background: rgba(70,72,212,0.07);
            color: #4648d4;
        }
        .mcq-btn:active:not(:disabled) { transform: scale(0.95); }
        .mcq-btn.correct {
            border-color: #00b07a;
            background: rgba(0,176,122,0.13);
            color: #00703e;
            pointer-events: none;
        }
        .mcq-btn.wrong {
            border-color: #e53935;
            background: rgba(229,57,53,0.1);
            color: #c62828;
            pointer-events: none;
        }
        .mcq-btn:disabled { pointer-events: none; opacity: 0.5; }
        .dark .mcq-btn { color: #cac4d0; border-color: #49454f; }
        .dark .mcq-btn.correct { border-color: #00b07a; background: rgba(0,176,122,0.18); color: #4dd8a0; }
        .dark .mcq-btn.wrong   { border-color: #ef9a9a; background: rgba(229,57,53,0.15); color: #ef9a9a; }

        .blank-slot {
            display: inline-block;
            min-width: 6rem;
            padding: 0.1rem 0.5rem;
            border-radius: 6px;
            border: 2px dashed #c0c1ff;
            background: #e1e0ff;
            color: #4648d4;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.12s;
            touch-action: manipulation;
        }
        .blank-slot.focused { border-style: solid; border-color: #4648d4; background: #c0c1ff; }
        .blank-slot.filled { color: #191c1e; background: #f2f4f6; border-color: #8c7164; border-style: solid; }
        .blank-slot.correct { border-color: #006c49 !important; background: #d1fae5 !important; color: #006c49 !important; }
        .blank-slot.wrong { border-color: #ba1a1a !important; background: #ffdad6 !important; color: #93000a !important; }
        .dark .blank-slot { background: #2f2ebe; border-color: #4648d4; color: #e1e0ff; }
        .dark .blank-slot.filled { background: #2d3133; color: #eff1f3; border-color: #584237; }

        /* ── 채점 결과 ─────────────────────────────────────── */
        .result-correct { background: rgba(0,176,122,0.10); border-radius: 10px; }
        .result-wrong   { background: rgba(255,218,214,0.55); border-radius: 10px; }
    </style>
</head>

<body class="bg-surface font-body text-on-surface overflow-x-hidden">

    <!-- ── TopAppBar ──────────────────────────────────────────── -->
    <header class="fixed top-0 w-full z-50 glass bg-surface/80 border-b border-outline-variant/20">
        <div class="flex justify-between items-center px-5 h-14 max-w-2xl mx-auto">
            <div class="flex items-center gap-3">
                <!-- Admin 백버튼 (fromAdmin 세션일 때만 표시) -->
                <button id="backToAdminBtn" onclick="backToAdmin()"
                    class="hidden items-center gap-1 px-2.5 py-1.5 rounded-lg
                           bg-primary-fixed text-primary text-xs font-bold
                           hover:bg-primary-fixed-dim transition-all active:scale-90">
                    <span class="material-symbols-outlined text-sm">arrow_back</span>
                    Admin
                </button>
                <div class="w-8 h-8 rounded-full bg-primary-fixed flex items-center justify-center flex-shrink-0">
                    <span class="font-bold text-primary text-xs font-headline" id="studentInitial">?</span>
                </div>
                <span class="font-headline font-bold text-primary tracking-tight" id="studentNameLabel">Concept Gacha</span>
            </div>
            <button onclick="document.documentElement.classList.toggle('dark')"
                class="w-9 h-9 flex items-center justify-center rounded-xl hover:bg-surface-container-low transition-colors active:scale-90">
                <span class="material-symbols-outlined text-[20px] text-on-surface-variant">dark_mode</span>
            </button>
        </div>
    </header>

    <aside id="sidebarInjected" class="hidden"></aside>

    <!-- ── Main ───────────────────────────────────────────────── -->
    <main class="pt-16 pb-32 px-4 max-w-lg mx-auto space-y-3">

        <!-- ── Daily Progress Banner ────────────────────────── -->
        <div id="dailyBanner" class="mt-4 px-1">
            <!-- 진행 중 -->
            <div id="dailyProgress"
                class="bg-surface-container-lowest rounded-xl px-4 py-3 shadow-[0px_2px_10px_rgba(88,66,55,0.07)]
                       flex items-center gap-3">
                <div class="flex-1 min-w-0">
                    <div class="flex items-center justify-between mb-1.5">
                        <span class="text-[10px] font-bold text-primary uppercase tracking-[0.12em] font-label">오늘의 학습</span>
                        <span class="text-xs font-bold text-on-surface font-label">
                            <span id="dailyDrawn">0</span><span class="text-outline font-normal"> / </span><span id="dailyTarget">10</span>
                        </span>
                    </div>
                    <div class="w-full h-1.5 rounded-full bg-surface-container-high overflow-hidden">
                        <div id="dailyBar"
                            class="h-full rounded-full transition-all duration-500"
                            style="width:0%; background: linear-gradient(90deg, #9d4300, #f97316)"></div>
                    </div>
                </div>
                <a href="dashboard.html"
                    class="shrink-0 w-8 h-8 flex items-center justify-center rounded-lg bg-primary-fixed text-primary
                           hover:bg-primary-fixed-dim transition-colors active:scale-90">
                    <span class="material-symbols-outlined text-[16px]">bar_chart</span>
                </a>
            </div>

            <!-- 오늘 완료 -->
            <div id="dailyDone" class="hidden rounded-xl px-4 py-3 flex items-center gap-3"
                style="background: rgba(0,176,122,0.10); border: 1px solid rgba(0,176,122,0.20)">
                <span class="material-symbols-outlined text-tertiary text-[20px]"
                    style="font-variation-settings:'FILL' 1">task_alt</span>
                <div class="flex-1">
                    <p class="text-sm font-bold text-tertiary font-label">오늘 목표 달성! 🎉</p>
                    <p class="text-[10px] text-outline font-label">내일도 학습을 이어가세요</p>
                </div>
                <a href="dashboard.html"
                    class="shrink-0 text-[10px] font-bold text-tertiary underline font-label">기록 보기</a>
            </div>
        </div>

        <!-- ── Draw Zone (카드 없을 때 표시) ─────────────────── -->
        <div id="drawZone" class="pt-1">
            <button id="gachaBtn"
                class="w-full h-13 rounded-full font-label font-semibold text-sm uppercase tracking-[0.08em]
                       text-on-primary shadow-[0_6px_20px_rgba(157,67,0,0.22)]
                       transition-all active:scale-[0.97] flex items-center justify-center gap-2.5"
                style="background: linear-gradient(135deg, #9d4300, #f97316); height: 3.25rem;">
                <span class="material-symbols-outlined text-[18px]" style="font-variation-settings:'FILL' 1">auto_awesome</span>
                카드 뽑기
            </button>
        </div>

        <!-- ── HeroCard ──────────────────────────────────────── -->
        <section id="heroCardSection">
            <div class="bg-surface-container-lowest dark:bg-inverse-surface rounded-xl overflow-hidden
                        shadow-[0px_4px_20px_rgba(88,66,55,0.09)] transition-all duration-300"
                 id="heroCardOuter">

                <!-- 상자 컬러 — 카드 왼쪽 accent bar -->
                <div class="flex">
                    <div id="boxAccentBar" class="w-[3px] flex-shrink-0 transition-colors duration-300"
                         style="background: #e0c0b1"></div>

                    <div class="flex-1 px-6 py-6 space-y-4">

                        <!-- 카테고리 라벨 -->
                        <span class="block text-[10px] font-bold text-primary dark:text-primary-fixed
                                     uppercase tracking-[0.12em] font-label"
                              id="cardCategory">개념 가챠</span>

                        <!-- 질문 -->
                        <div class="space-y-2">
                            <h2 class="font-headline text-[1.6rem] font-bold leading-[1.25] text-on-surface dark:text-inverse-on-surface"
                                id="cardQuestion">카드를 뽑아보세요!</h2>
                            <div id="cardQuestionImage" class="hidden">
                                <img src="" class="max-h-56 mx-auto rounded-lg shadow-sm" id="cardQuestionImg" />
                            </div>
                            <div class="w-8 h-[3px] rounded-full" id="accentLine"
                                 style="background: rgba(249,115,22,0.35)"></div>
                        </div>

                        <!-- 정답 박스 -->
                        <div class="hidden rounded-lg p-4" id="answerBox"
                            style="background:rgba(0,176,122,0.12); border: 1px solid rgba(0,176,122,0.22)">
                            <div class="flex items-center gap-2 mb-2">
                                <span class="material-symbols-outlined text-tertiary text-[16px]"
                                    style="font-variation-settings:'FILL' 1">check_circle</span>
                                <span class="text-[10px] font-bold text-tertiary font-label uppercase tracking-wider">
                                    Answer
                                </span>
                            </div>
                            <p class="font-headline text-xl font-bold text-on-tertiary-container dark:text-tertiary-container"
                                id="cardAnswer"></p>
                        </div>

                        <!-- MCQ 선택지 그리드 (distractors 있을 때) -->
                        <div class="hidden" id="mcqGrid">
                            <div class="grid grid-cols-2 gap-2" id="mcqChoices"></div>
                        </div>

                        <!-- 정답 보기 버튼 (distractors 없을 때 fallback) -->
                        <button class="w-full py-3 rounded-lg bg-surface-container-low dark:bg-surface-container
                                       text-on-surface-variant text-sm font-semibold hidden
                                       transition-all active:scale-[0.98] hover:bg-surface-container"
                            id="showAnswerBtn">정답 보기</button>

                        <!-- 피드백 버튼 -->
                        <div class="hidden flex w-full gap-3" id="feedbackBtns">
                            <button class="flex-1 py-3 rounded-lg border border-outline-variant
                                           hover:border-tertiary hover:bg-tertiary/5 hover:text-tertiary
                                           text-sm font-semibold transition-all
                                           text-on-surface-variant active:scale-[0.97] flex items-center justify-center gap-1.5"
                                id="successBtn">
                                <span class="material-symbols-outlined text-[16px]">check</span>
                                알았다
                            </button>
                            <button class="flex-1 py-3 rounded-lg border border-outline-variant
                                           hover:border-error/50 hover:bg-error-container/40 hover:text-on-error-container
                                           text-sm font-semibold transition-all
                                           text-on-surface-variant active:scale-[0.97] flex items-center justify-center gap-1.5"
                                id="failBtn">
                                <span class="material-symbols-outlined text-[16px]">close</span>
                                몰랐다
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- ── Practice Panel ─────────────────────────────────── -->
        <section class="hidden" id="practiceSection">
            <div class="bg-surface-container dark:bg-surface-container rounded-xl p-5 space-y-4
                        border border-outline-variant/30">

                <!-- 헤더 -->
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <div class="w-1 h-5 rounded-full bg-secondary-container flex-shrink-0"></div>
                        <h3 class="font-headline font-bold text-base text-on-surface dark:text-inverse-on-surface"
                            id="practiceTopicLabel"></h3>
                    </div>
                    <button id="newProblemBtn"
                        class="text-xs px-3 py-1.5 rounded-lg bg-surface-container-lowest dark:bg-surface-container-high
                               text-secondary font-semibold hover:bg-secondary-fixed transition-all
                               flex items-center gap-1 active:scale-95">
                        <span class="material-symbols-outlined text-[14px]">refresh</span> 다른 문제
                    </button>
                </div>

                <!-- 문제 카드 -->
                <div class="bg-surface-container-lowest dark:bg-inverse-surface rounded-xl p-5
                            shadow-[0px_2px_8px_rgba(88,66,55,0.05)]">

                    <div id="practiceFractionView">
                        <p class="text-on-surface dark:text-inverse-on-surface font-medium leading-relaxed"
                            id="practiceQuestion"></p>
                        <div id="practiceHintArea" class="hidden mt-2">
                            <p class="text-xs text-outline" id="practiceQuestionSub"></p>
                        </div>
                        <div id="practiceHintBtnWrap" class="hidden mt-2">
                            <button onclick="document.getElementById('practiceHintArea').classList.remove('hidden');document.getElementById('practiceHintBtnWrap').classList.add('hidden');"
                                class="text-xs text-outline border border-outline-variant rounded px-2 py-0.5 hover:bg-surface-container-low">
                                💡 힌트 보기
                            </button>
                        </div>
                        <p class="text-sm font-semibold text-outline mt-2" id="practiceInstruction"></p>
                        <div id="practiceShapeView" class="hidden mt-3 flex justify-center"></div>
                    </div>

                    <div class="hidden" id="practiceTreeView">
                        <p class="text-xs text-center text-outline mb-4">빈칸에 알맞은 말을 쓰시오</p>
                        <div id="practiceTreeHTML" class="flex justify-center"></div>
                    </div>

                    <!-- 스마트 입력 -->
                    <div id="smartInputArea" class="hidden mt-4">

                        <div id="numericDisplayBox" class="hidden mb-3">
                            <div class="flex items-center justify-center gap-2 h-12 px-5 rounded-lg
                                        bg-surface-container-low dark:bg-surface-container">
                                <span id="kdValue"
                                    class="text-2xl font-bold text-on-surface-variant dark:text-outline">?</span>
                                <span id="kdUnit"
                                    class="hidden text-xl font-bold text-secondary dark:text-secondary-fixed-dim"></span>
                            </div>
                        </div>

                        <div id="fracDisplayBox" class="hidden mb-3">
                            <div class="flex justify-center py-2">
                                <div class="text-center min-w-[4rem]">
                                    <div id="fracNum"
                                        class="text-2xl font-bold py-1 text-secondary dark:text-secondary-fixed">?</div>
                                    <div class="h-[2px] bg-on-surface dark:bg-inverse-on-surface my-1 rounded"></div>
                                    <div id="fracDen"
                                        class="text-2xl font-bold py-1 text-outline">?</div>
                                </div>
                            </div>
                        </div>

                        <div id="unitBtnPanel" class="hidden flex-wrap gap-2 mb-3 justify-center"></div>
                        <div id="algBtnPanel" class="hidden flex-wrap gap-2 mb-3 justify-center"></div>
                        <div id="choiceBtnPanel" class="hidden flex gap-2 mb-3 justify-center"></div>

                        <!-- 4열 숫자 키패드 -->
                        <div id="numericKeypad" class="hidden grid grid-cols-4 gap-2 mb-3">
                            <button class="kp-btn" onclick="IC.key('1')">1</button>
                            <button class="kp-btn" onclick="IC.key('2')">2</button>
                            <button class="kp-btn" onclick="IC.key('3')">3</button>
                            <button class="kp-btn kp-del" onclick="IC.key('⌫')">⌫</button>
                            <button class="kp-btn" onclick="IC.key('4')">4</button>
                            <button class="kp-btn" onclick="IC.key('5')">5</button>
                            <button class="kp-btn" onclick="IC.key('6')">6</button>
                            <button class="kp-btn kp-dot" onclick="IC.key('.')">.</button>
                            <button class="kp-btn" onclick="IC.key('7')">7</button>
                            <button class="kp-btn" onclick="IC.key('8')">8</button>
                            <button class="kp-btn" onclick="IC.key('9')">9</button>
                            <button class="kp-btn" onclick="IC.key('0')">0</button>

    <script type="module">
        import { getOrCreateTodaySession, recordCardResult } from './js/daily-session.js'

        // 전역으로 노출 (non-module 스크립트에서 접근)
        window._dailySession = null

        async function initDailyBanner(studentId) {
            try {
                const { session, remaining } = await getOrCreateTodaySession(studentId)
                window._dailySession = session
                updateDailyBanner(session.cards_drawn, session.cards_target)
            } catch (e) {
                console.warn('Daily session init failed:', e)
            }
        }

        function updateDailyBanner(drawn, target) {
            const pct = Math.round((drawn / target) * 100)
            const el = {
                drawn:    document.getElementById('dailyDrawn'),
                target:   document.getElementById('dailyTarget'),
                bar:      document.getElementById('dailyBar'),
                progress: document.getElementById('dailyProgress'),
                done:     document.getElementById('dailyDone'),
            }
            if (el.drawn)  el.drawn.textContent  = drawn
            if (el.target) el.target.textContent = target
            if (el.bar)    el.bar.style.width    = pct + '%'

            if (drawn >= target) {
                el.progress?.classList.add('hidden')
                el.done?.classList.remove('hidden')
            } else {
                el.progress?.classList.remove('hidden')
                el.done?.classList.add('hidden')
            }
        }

        window._recordDailyResult = async function(cardId, success, boxBefore, boxAfter) {
            if (!window._dailySession) return
            try {
                const updated = await recordCardResult(
                    window._dailySession.id, cardId, success ? 'success' : 'fail', boxBefore, boxAfter
                )
                if (updated) {
                    window._dailySession = updated
                    updateDailyBanner(updated.cards_drawn, updated.cards_target)
                }
            } catch (e) {
                console.warn('Daily record failed:', e)
            }
        }

        // DOMContentLoaded 이후 studentId 감지
        document.addEventListener('DOMContentLoaded', () => {
            const saved = sessionStorage.getItem('currentStudent')
            if (saved) {
                const { id } = JSON.parse(saved)
                initDailyBanner(id)
            }
        })
    </script>

    <script>
        let currentCard = null;
        let currentStudentId = null;
        let currentProblem = null;

        // 상자별 컬러
        const BOX_COLORS = ['#d8dadc', '#f87171', '#facc15', '#60a5fa', '#34d399', '#f97316'];

        // ─── InputController (IC) ────────────────────────────────
        const IC = {
            type: null,
            value: '', unit: '',
            fracFocus: 'num', fracNum: '', fracDen: '',
            algExpr: '', algCur: '',
            choiceVal: null, blankFocused: null,

            init(gen, problem) {
                this.type = problem.inputType || gen.inputType || 'numeric';
                this.value = ''; this.unit = '';
                this.fracFocus = 'num'; this.fracNum = ''; this.fracDen = '';
                this.algExpr = ''; this.algCur = '';
                this.choiceVal = null; this.blankFocused = null;

                // 동적 MCQ: problem.distractors가 있으면 choice 모드로 자동 전환
                // algebraic 타이핑 대신 그 문제에 맞게 계산된 선택지 버튼으로 입력
                const hasDynamicMcq = Array.isArray(problem.distractors) && problem.distractors.length > 0;
                if (hasDynamicMcq) this.type = 'choice';

                document.querySelectorAll('#numericKeypad button').forEach(b => b.disabled = false);
                const sb = document.getElementById('practiceSubmitBtn');
                if (sb) sb.disabled = false;

                const show = (id, v) => { const el = document.getElementById(id); if (el) el.classList.toggle('hidden', !v); };
                const isKey = ['numeric','fraction','unit','algebraic'].includes(this.type);
                show('smartInputArea',    this.type !== 'fillblank');
                show('numericDisplayBox', isKey && this.type !== 'fraction');
                show('fracDisplayBox',    this.type === 'fraction');
                show('numericKeypad',     isKey);
                show('fracSlashKey',      this.type === 'fraction');
                show('unitBtnPanel',      this.type === 'unit');
                show('algBtnPanel',       this.type === 'algebraic');
                show('choiceBtnPanel',    this.type === 'choice');
                show('practiceSubmitBtn', this.type !== 'fillblank');

                if (this.type === 'unit') {
                    const units = gen.units || [];
                    document.getElementById('unitBtnPanel').innerHTML =
                        units.map(u => `<button class="unit-btn" data-unit="${u}" onclick="IC.pickUnit('${u}')">${u}</button>`).join('') +
                        `<button class="unit-btn" data-unit="" onclick="IC.pickUnit('')">없음</button>`;
                    document.getElementById('unitBtnPanel').style.display = 'flex';
                }

                if (this.type === 'algebraic') {
                    const vars = problem.vars || [];
                    const panel = document.getElementById('algBtnPanel');
                    panel.innerHTML =
                        vars.map(v => `<button class="alg-btn" onclick="IC.algVar('${v}')">${v}</button>`).join('') +
                        `<button class="alg-btn alg-op" onclick="IC.algOp('+')">+</button>` +
                        `<button class="alg-btn alg-op" onclick="IC.algOp('-')">−</button>`;
                    panel.style.display = 'flex';
                }

                if (this.type === 'choice') {
                    let choices;
                    if (hasDynamicMcq) {
                        // 동적 MCQ: 정답 + 오답 최대 4개를 랜덤 셔플
                        const correct = problem.answer;
                        const wrong = problem.distractors.slice(0, 4);
                        choices = [correct, ...wrong].sort(() => Math.random() - 0.5);
                    } else {
                        choices = gen.choices || [];
                    }
                    document.getElementById('choiceBtnPanel').innerHTML =
                        choices.map(c => `<button class="choice-btn" data-val="${c}" onclick="IC.pick('${c.replace(/'/g,"\\'")}', this)">${c}</button>`).join('');
                    document.getElementById('choiceBtnPanel').style.display = 'flex';
                }

                this._updateDisplay();
            },

            key(k) {
                if (this.type === 'fraction') {
                    if (k === '⌫') {
                        if (this.fracFocus === 'den') this.fracDen = this.fracDen.slice(0, -1);
                        else this.fracNum = this.fracNum.slice(0, -1);
                    } else if (k === '/') {
                        this.fracFocus = 'den';
                    } else if (k !== '.') {
                        if (this.fracFocus === 'num') this.fracNum += k;
                        else this.fracDen += k;
                    }
                } else if (this.type === 'algebraic') {
                    if (k === '⌫') {
                        if (this.algCur) this.algCur = this.algCur.slice(0, -1);
                        else this.algExpr = this.algExpr.trimEnd().slice(0, -1).trimEnd();
                    } else if (k !== '.') {
                        this.algCur += k;
                    }
                } else {
                    if (k === '⌫') this.value = this.value.slice(0, -1);
                    else if (k === '.' && this.value.includes('.')) return;
                    else this.value += k;
                }
                this._updateDisplay();
            },

            algVar(v) { this.algExpr += this.algCur + v; this.algCur = ''; this._updateDisplay(); },

            algOp(op) {
                if (this.algExpr || this.algCur) {
                    this.algExpr += this.algCur + ' ' + op + ' ';
                    this.algCur = '';
                }
                this._updateDisplay();
            },

            pickUnit(u) {
                this.unit = this.unit === u ? '' : u;
                document.querySelectorAll('.unit-btn').forEach(b =>
                    b.classList.toggle('selected', b.dataset.unit === this.unit));
                this._updateDisplay();
            },

            pick(val, btn) {
                this.choiceVal = val;
                document.querySelectorAll('.choice-btn').forEach(b => b.classList.remove('selected'));
                if (btn) btn.classList.add('selected');
            },

            tapBlank(el) {
                document.querySelectorAll('.blank-slot').forEach(b => b.classList.remove('focused'));
                el.classList.add('focused');
                this.blankFocused = el;
            },

            fillWord(word, chipEl) {
                if (!this.blankFocused) return;
                const prev = this.blankFocused.dataset.filled;
                if (prev) {
                    document.querySelectorAll('.word-chip').forEach(c => {
                        if (c.dataset.word === prev) c.classList.remove('used');
                    });
                }
                this.blankFocused.textContent = word;
                this.blankFocused.dataset.filled = word;
                this.blankFocused.classList.add('filled');
                this.blankFocused.classList.remove('focused');
                if (chipEl) chipEl.classList.add('used');
                const next = document.querySelector('.blank-slot:not(.filled)');
                if (next) this.tapBlank(next);
                else this.blankFocused = null;
            },

            getAnswer() {
                switch (this.type) {
                    case 'fraction':  return (this.fracNum && this.fracDen) ? `${this.fracNum}/${this.fracDen}` : '';
                    case 'unit':      return this.value + this.unit;
                    case 'choice':    return this.choiceVal || '';
                    case 'algebraic': return (this.algExpr + this.algCur).trim();
                    default:          return this.value;
                }
            },

            disable() {
                document.querySelectorAll('#numericKeypad button, .unit-btn, .alg-btn, .choice-btn, .word-chip').forEach(b => b.disabled = true);
                const sb = document.getElementById('practiceSubmitBtn');
                if (sb) sb.disabled = true;
            },

            _updateDisplay() {
                if (this.type === 'fraction') {
                    const numEl = document.getElementById('fracNum');
                    const denEl = document.getElementById('fracDen');
                    if (!numEl) return;
                    numEl.textContent = this.fracNum || '?';
                    denEl.textContent = this.fracDen || '?';
                    numEl.style.opacity = this.fracFocus === 'num' ? '1' : '0.4';
                    denEl.style.opacity = this.fracFocus === 'den' ? '1' : '0.4';
                } else {
                    const valEl = document.getElementById('kdValue');
                    const unitEl = document.getElementById('kdUnit');
                    if (!valEl) return;
                    if (this.type === 'algebraic') {
                        valEl.textContent = (this.algExpr + this.algCur).trim() || '?';
                    } else {
                        valEl.textContent = this.value || '?';
                    }
                    if (unitEl) {
                        unitEl.textContent = this.unit;
                        unitEl.classList.toggle('hidden', !this.unit);
                    }
                }
            },
        };

        async function pullCard() {
            const btn = document.getElementById('gachaBtn');
            btn.disabled = true;
            try {
                currentCard = await API.getRandomCard(currentStudentId);
                displayCard(currentCard);
            } catch (e) {

        function displayCard(card) {
            // DrawZone 숨김
            document.getElementById('drawZone').classList.add('hidden');

            const qTxt    = document.getElementById('cardQuestion');
            const qImgBox = document.getElementById('cardQuestionImage');
            const qImg    = document.getElementById('cardQuestionImg');

            if (card.type === 'image' && card.questionImage) {
                qTxt.classList.add('hidden');
                qImgBox.classList.remove('hidden');
                qImg.src = `/assets/${card.questionImage}`;
            } else {
                qTxt.classList.remove('hidden');
                qImgBox.classList.add('hidden');
                qTxt.textContent = card.question || '(질문 없음)';
            }

            document.getElementById('cardAnswer').textContent = card.answer || '-';

            // 상자 accent bar 색상 업데이트
            document.getElementById('boxAccentBar').style.background = BOX_COLORS[card.box] || '#d8dadc';

            document.getElementById('answerBox').classList.add('hidden');
            document.getElementById('feedbackBtns').classList.add('hidden');

            // MCQ 선택지 생성 시도
            const mcqResult = (typeof getDistractors === 'function') ? getDistractors(card, 6) : null;
            const mcqGrid = document.getElementById('mcqGrid');
            const mcqChoices = document.getElementById('mcqChoices');
            const showAnswerBtn = document.getElementById('showAnswerBtn');

            if (mcqResult) {
                // MCQ 모드: 선택지 그리드 표시
                mcqChoices.innerHTML = '';
                // "25 — 설명" 타입: answerBox엔 전체 설명, 선택지엔 숫자만
                if (mcqResult.fullAnswer) {
                    document.getElementById('cardAnswer').textContent = mcqResult.fullAnswer;
                }
                mcqResult.choices.forEach(choice => {
                    const btn = document.createElement('button');
                    btn.className = 'mcq-btn';
                    btn.textContent = choice;
                    btn.onclick = () => handleMcqChoice(btn, choice, mcqResult.correctAnswer, mcqChoices);
                    mcqChoices.appendChild(btn);
                });
                mcqGrid.classList.remove('hidden');
                showAnswerBtn.classList.add('hidden');
            } else {
                // Fallback: 기존 "정답 보기" 방식
                mcqGrid.classList.add('hidden');
                showAnswerBtn.classList.remove('hidden');
            }

            const studentName = Layout.currentStudent?.name || '';
            document.getElementById('cardCategory').textContent =
                card.topic || (studentName ? studentName + '의 개념' : '개념 카드');

            const practiceSection = document.getElementById('practiceSection');
            const topic = inferTopicClient(card);
            if (topic && PROBLEM_GENERATORS[topic]) {
                card._inferredTopic = topic;
                practiceSection.classList.remove('hidden');
                loadPractice(topic);
            } else {
                practiceSection.classList.add('hidden');
            }
        }

        function inferTopicClient(card) {
            if (card.topic && PROBLEM_GENERATORS[card.topic]) return card.topic;
            const q = (card.question || '').toLowerCase();
            const a = (card.answer || '').toLowerCase();
            const all = q + ' ' + a;

            if (/속력|거리.+시간|시간.+거리|km\/h|속도/.test(all))    return '속력';
            if (/순환소수|순환마디/.test(all))                          return '순환소수';
            if (/동류항/.test(all))                                      return '동류항';
            if (/보조선|ㄱ자|ㄷ자|복잡한.도형|도형.나누/.test(all))    return '복잡한도형';
            if (/km²|m²|cm²|mm²|넓이.단위|단위.변환.*넓이/.test(all)) return '단위변환';
            if (/원에 내접|내접하는 마름모|원.*마름모.*넓이|마름모.*원.*넓이/.test(all)) return '원내접마름모';
            if (/종이.접|접어서|접었을 때|접힌.*삼각형|합동.*삼각형/.test(all))         return '종이접기';
            if (/넓이.*주어.*변|변.*길이.*구|역산|높이.*구하|세로.*구하/.test(all))      return '넓이역산';
            if (/색칠.*부분|색칠한.*넓이|색칠.*면적|빈 부분.*빼/.test(all))             return '색칠부분';
            if (/거듭제곱|밑.*지수|지수.*밑/.test(q))  return '거듭제곱';
            if (/역수/.test(q))                          return '역수';
            if (/약분|기약분수|통분/.test(q))            return '약분';
            if (/서로소/.test(q))                         return '서로소';
            if (/(?<![복유무])소수|합성수/.test(q))      return '소수';
            if (/제곱근|√/.test(q))                      return '제곱근';
            if (/대소관계|크기.*비교/.test(q))           return '대소관계';
            const isFormula = a.length < 60 && /[×÷]/.test(a);
            if (/삼각형.*(넓이|공식)/.test(all))                         return '삼각형';
            if (/직사각형|정사각형/.test(q) || (isFormula && /직사각형/.test(a))) return '직사각형';
            if (/마름모/.test(all))                                       return '마름모';
            if (/사다리꼴/.test(all))                                     return '사다리꼴';
            return null;
        }

        function buildTreeHTML(blankIds) {
            const gen = PROBLEM_GENERATORS['수체계'];
            const node = (id, label) => {
                if (id in blankIds) {
                    const aliases = gen.aliases[id] || [label];
                    return `<span class="blank-slot" data-id="${id}" data-aliases='${JSON.stringify(aliases)}' onclick="IC.tapBlank(this)">빈칸</span>`;
                }
                return `<span class="font-bold text-on-surface dark:text-inverse-on-surface">${label}</span>`;
            };
            return `
            <div class="font-mono text-sm leading-loose text-left inline-block">
                <div>${node('rational', '유리수')}</div>
                <div>├─ ${node('integer', '정수')}</div>
                <div>│&nbsp;&nbsp;├─ ${node('pos_int', '양의 정수 (자연수)')}</div>
                <div>│&nbsp;&nbsp;├─ ${node('zero', '0')}</div>
                <div>│&nbsp;&nbsp;└─ ${node('neg_int', '음의 정수')}</div>
                <div>└─ ${node('non_int', '정수가 아닌 유리수')}</div>
                <div>&nbsp;&nbsp;&nbsp;├─ ${node('finite', '유한소수')}</div>
                <div>&nbsp;&nbsp;&nbsp;└─ ${node('repeating', '순환소수')}</div>
            </div>`;
        }

        function buildWordBank() {
            const allWords = ['유리수','정수','양의 정수 (자연수)','0','음의 정수','정수가 아닌 유리수','유한소수','순환소수'];
            const shuffled = [...allWords].sort(() => Math.random() - 0.5);
            return `<div class="flex flex-wrap gap-2 mt-3 justify-center" id="wordBankArea">` +
                shuffled.map(w => `<button class="word-chip" data-word="${w}" onclick="IC.fillWord('${w.replace(/'/g,"\\'")}', this)">${w}</button>`).join('') +
                `</div>`;
        }

        function loadPractice(topic) {
            const gen = PROBLEM_GENERATORS[topic];
            currentProblem = gen.generate();

            document.getElementById('practiceTopicLabel').textContent = gen.label;
            document.getElementById('practiceResult').classList.add('hidden');
            document.getElementById('practiceSteps').classList.add('hidden');
            document.getElementById('nextCardBtn').classList.add('hidden');
            document.getElementById('nextCardBtn').classList.remove('flex');

            if (currentProblem.type === 'fillblank') {
                document.getElementById('practiceFractionView').classList.add('hidden');
                document.getElementById('smartInputArea').classList.add('hidden');
                document.getElementById('practiceTreeView').classList.remove('hidden');
                document.getElementById('practiceTreeSubmitRow').classList.remove('hidden');
                document.getElementById('practiceTreeHTML').innerHTML =
                    buildTreeHTML(currentProblem.blankIds) + buildWordBank();
                document.getElementById('practiceTreeSubmitBtn').disabled = false;
                IC.blankFocused = null;
                const first = document.querySelector('.blank-slot');
                if (first) IC.tapBlank(first);
            } else {
                document.getElementById('practiceTreeView').classList.add('hidden');
                document.getElementById('practiceTreeSubmitRow').classList.add('hidden');
                document.getElementById('practiceFractionView').classList.remove('hidden');
                document.getElementById('practiceQuestion').textContent = currentProblem.question;
                const sub = currentProblem.questionSub || '';
                document.getElementById('practiceQuestionSub').textContent = sub;
                document.getElementById('practiceHintArea').classList.add('hidden');
                document.getElementById('practiceHintBtnWrap').classList.toggle('hidden', !sub);
                document.getElementById('practiceInstruction').textContent = gen.instruction || '답을 구하시오';
                const shapeView = document.getElementById('practiceShapeView');
                if (currentProblem.shape && window.ShapeRenderer) {
                    shapeView.innerHTML = ShapeRenderer.render(currentProblem.shape, { width: 320, height: 220 });
                    shapeView.classList.remove('hidden');
                } else {
                    shapeView.classList.add('hidden');
                    shapeView.innerHTML = '';
                }
                IC.init(gen, currentProblem);
                document.getElementById('practiceSubmitBtn').disabled = false;
            }
        }

        function submitPractice() {
            if (!currentProblem) return;
            const resultBox = document.getElementById('practiceResult');
            const resultMsg = document.getElementById('practiceResultMsg');
            const stepsBox  = document.getElementById('practiceSteps');
            resultBox.classList.remove('hidden', 'result-correct', 'result-wrong');
            stepsBox.innerHTML = '<p class="text-xs font-bold text-outline uppercase mb-2">풀이</p>';

            let correct;

            if (currentProblem.type === 'fillblank') {
                const slots = document.querySelectorAll('.blank-slot');
                let hasWrong = false;
                slots.forEach(slot => {
                    const aliases = JSON.parse(slot.dataset.aliases || '[]');
                    const filled  = slot.dataset.filled || '';
                    const ok = aliases.some(a => a === filled);
                    slot.classList.remove('focused', 'filled');
                    slot.classList.toggle('correct', ok);
                    slot.classList.toggle('wrong', !ok);
                    if (!ok) { hasWrong = true; slot.textContent = `✗ ${aliases[0]}`; }
                });
                correct = !hasWrong;
                document.getElementById('practiceTreeSubmitBtn').disabled = true;
                document.querySelectorAll('.word-chip').forEach(c => c.disabled = true);
            } else {
                const gen = PROBLEM_GENERATORS[currentCard._inferredTopic || currentCard.topic];
                const userInput = IC.getAnswer();
                if (!userInput) return;
                correct = gen.checkAnswer(userInput, currentProblem.answer);
                IC.disable();

                if (!correct && currentProblem.steps) {
                    currentProblem.steps.forEach(step => {
                        const p = document.createElement('p');
                        p.className = 'text-sm text-on-surface-variant font-mono';
                        p.textContent = step;
                        stepsBox.appendChild(p);
                    });
                    stepsBox.classList.remove('hidden');
                }
            }

            if (correct) {
                resultBox.classList.add('result-correct');
                resultMsg.textContent = '✓ 정답!';
                resultMsg.className = 'font-semibold text-center mb-2 text-tertiary font-headline';
            } else {
                resultBox.classList.add('result-wrong');
                resultMsg.textContent = currentProblem.type === 'fillblank'
                    ? '✗ 다시 확인해볼까요?'
                    : `✗ 정답: ${currentProblem.answer}`;
                resultMsg.className = 'font-semibold text-center mb-2 text-on-error-container font-headline';
            }

            // 채점 완료 → "다음 카드 뽑기" 버튼 표시
            const nextBtn = document.getElementById('nextCardBtn');
            nextBtn.classList.remove('hidden');
            nextBtn.classList.add('flex');
            nextBtn.onclick = () => submitFeedback(correct);
        }

        function handleMcqChoice(btn, selected, correct, container) {
            // 모든 버튼 비활성화
            container.querySelectorAll('.mcq-btn').forEach(b => b.disabled = true);

            const isCorrect = selected.trim() === correct.trim();
            if (isCorrect) {
                btn.classList.add('correct');
                // 정답 박스 표시
                document.getElementById('answerBox').classList.remove('hidden');
                // 알았다로 자동 처리 (0.7초 후)
                setTimeout(() => submitFeedback(true), 700);
            } else {
                btn.classList.add('wrong');
                // 정답 버튼 하이라이트
                container.querySelectorAll('.mcq-btn').forEach(b => {
                    if (b.textContent.trim() === correct.trim()) b.classList.add('correct');
                });
                // 정답 박스 표시
                document.getElementById('answerBox').classList.remove('hidden');
                // 몰랐다로 자동 처리 (1.2초 후)
                setTimeout(() => submitFeedback(false), 1200);
            }
        }

        async function submitFeedback(success) {
            if (!currentCard) return;
            try {
                const boxBefore = currentCard.box;
                await API.submitFeedback(currentCard.id, success, currentStudentId);
                Layout.showToast(success ? '잘 기억하고 있어요!' : '한 번 더 연습해봐요');

                // 일일 세션 기록
                const boxAfter = success
                    ? Math.min(boxBefore + 1, 5)
                    : Math.max(boxBefore - 1, 1);
                if (window._recordDailyResult) {
                    window._recordDailyResult(currentCard.id, success, boxBefore, boxAfter);
                }

                // 카드 초기화
                document.getElementById('cardQuestion').textContent = '카드를 뽑아보세요!';
                document.getElementById('cardQuestion').classList.remove('hidden');
                document.getElementById('cardQuestionImage').classList.add('hidden');
                document.getElementById('answerBox').classList.add('hidden');
                document.getElementById('showAnswerBtn').classList.add('hidden');
                document.getElementById('mcqGrid').classList.add('hidden');
                document.getElementById('feedbackBtns').classList.add('hidden');
                document.getElementById('boxAccentBar').style.background = '#e0c0b1';
                document.getElementById('practiceSection').classList.add('hidden');

                const studentName = Layout.currentStudent?.name || '';
                document.getElementById('cardCategory').textContent = studentName ? studentName + '의 개념 카드' : '개념 가챠';
                currentCard = null;

                // DrawZone 다시 표시
                const dz = document.getElementById('drawZone');
                dz.classList.remove('hidden');
                document.getElementById('gachaBtn').disabled = false;

                Layout.loadStats();
            } catch (e) {
                Layout.showToast('저장 실패', true);
                // 실패해도 drawZone 복구해서 진행 가능하게
                document.getElementById('drawZone').classList.remove('hidden');
                document.getElementById('gachaBtn').disabled = false;
                currentCard = null;
            }
        }

        if (window.matchMedia('(prefers-color-scheme: dark)').matches)
            document.documentElement.classList.add('dark');
    </script>
</body>
</html>
