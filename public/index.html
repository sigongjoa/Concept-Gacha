<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대시보드 - Concept Gacha</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
        }
    </style>
</head>

<body class="bg-gradient-to-br from-purple-50 to-blue-50 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-6xl">
        <!-- 사용자 정보 헤더 -->
        <div class="bg-white rounded-2xl shadow-xl p-6 mb-8">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-3xl font-bold text-gray-800" id="userName">로딩 중...</h1>
                    <p class="text-gray-600 mt-1">학습 카드 관리 시스템</p>
                </div>
                <button onclick="handleSignOut()"
                    class="px-6 py-3 bg-red-500 hover:bg-red-600 text-white rounded-lg font-medium transition transform hover:scale-105">
                    로그아웃
                </button>
            </div>
        </div>

        <!-- 액션 버튼 -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <a href="gacha.html"
                class="block bg-gradient-to-br from-purple-500 to-purple-600 hover:from-purple-600 hover:to-purple-700 text-white rounded-2xl p-8 text-center transition transform hover:scale-105 shadow-lg">
                <div class="text-5xl mb-3">🎴</div>
                <h3 class="text-2xl font-bold mb-2">가챠 시작</h3>
                <p class="text-sm opacity-90">랜덤 카드 뽑기</p>
            </a>

            <a href="add.html"
                class="block bg-gradient-to-br from-blue-500 to-blue-600 hover:from-blue-600 hover:to-blue-700 text-white rounded-2xl p-8 text-center transition transform hover:scale-105 shadow-lg">
                <div class="text-5xl mb-3">➕</div>
                <h3 class="text-2xl font-bold mb-2">카드 추가</h3>
                <p class="text-sm opacity-90">새로운 학습 카드 만들기</p>
            </a>

            <a href="list.html"
                class="block bg-gradient-to-br from-green-500 to-green-600 hover:from-green-600 hover:to-green-700 text-white rounded-2xl p-8 text-center transition transform hover:scale-105 shadow-lg">
                <div class="text-5xl mb-3">📋</div>
                <h3 class="text-2xl font-bold mb-2">카드 목록</h3>
                <p class="text-sm opacity-90">내 카드 관리하기</p>
            </a>
        </div>

        <!-- 통계 -->
        <div class="bg-white rounded-2xl shadow-xl p-8">
            <h3 class="text-2xl font-bold text-gray-800 mb-6">📊 학습 통계</h3>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
                <div class="text-center p-4 bg-purple-50 rounded-xl">
                    <div class="text-4xl font-bold text-purple-600" id="totalCards">-</div>
                    <div class="text-sm text-gray-600 mt-2 font-medium">총 카드</div>
                </div>
                <div class="text-center p-4 bg-blue-50 rounded-xl">
                    <div class="text-4xl font-bold text-blue-600" id="box1Cards">-</div>
                    <div class="text-sm text-gray-600 mt-2 font-medium">Box 1</div>
                </div>
                <div class="text-center p-4 bg-green-50 rounded-xl">
                    <div class="text-4xl font-bold text-green-600" id="box2Cards">-</div>
                    <div class="text-sm text-gray-600 mt-2 font-medium">Box 2</div>
                </div>
                <div class="text-center p-4 bg-yellow-50 rounded-xl">
                    <div class="text-4xl font-bold text-yellow-600" id="box3Cards">-</div>
                    <div class="text-sm text-gray-600 mt-2 font-medium">Box 3</div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { requireAuth, displayUserInfo, signOut } from './js/auth.js'
        import { supabase } from './js/supabase-client.js'

        // 로그인 체크
        const isAuth = await requireAuth()
        if (!isAuth) {
            throw new Error('Not authenticated')
        }

        // 사용자 정보 표시
        await displayUserInfo('userName')

        // 로그아웃 핸들러
        window.handleSignOut = async () => {
            if (confirm('로그아웃하시겠습니까?')) {
                await signOut()
            }
        }

        // 통계 로드
        async function loadStats() {
            try {
                const { data: { user } } = await supabase.auth.getUser()
                if (!user) return

                // 본인 학생 ID 가져오기
                const { data: student } = await supabase
                    .from('students')
                    .select('id')
                    .eq('user_id', user.id)
                    .single()

                if (!student) return

                // 카드 통계 가져오기
                const { data: cards } = await supabase
                    .from('cards')
                    .select('box')
                    .eq('student_id', student.id)

                if (!cards) return

                // 통계 계산
                const total = cards.length
                const box1 = cards.filter(c => c.box === 1).length
                const box2 = cards.filter(c => c.box === 2).length
                const box3 = cards.filter(c => c.box === 3).length

                // UI 업데이트
                document.getElementById('totalCards').textContent = total
                document.getElementById('box1Cards').textContent = box1
                document.getElementById('box2Cards').textContent = box2
                document.getElementById('box3Cards').textContent = box3

            } catch (error) {
                console.error('Error loading stats:', error)
            }
        }

        // 통계 로드
        loadStats()
    </script>
</body>

</html>
