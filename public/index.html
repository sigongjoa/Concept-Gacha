<!DOCTYPE html>
<html class="light" lang="ko">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>개념 가챠 - 로그인</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800;900&family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

    <script id="tailwind-config">
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'surface':                    '#fdf6ec',
                        'surface-bright':             '#fdf6ec',
                        'surface-dim':                '#e8d9c8',
                        'surface-container-lowest':   '#ffffff',
                        'surface-container-low':      '#f5ead8',
                        'surface-container':          '#ecdece',
                        'surface-container-high':     '#e2d0be',
                        'surface-container-highest':  '#d8c4b0',
                        'primary':                    '#c23800',
                        'primary-container':          '#ff6535',
                        'primary-fixed':              '#ffe8d9',
                        'primary-fixed-dim':          '#ffb899',
                        'on-primary':                 '#ffffff',
                        'on-primary-container':       '#5c1500',
                        'secondary':                  '#2a2b96',
                        'secondary-container':        '#5254e8',
                        'secondary-fixed':            '#e0e1ff',
                        'secondary-fixed-dim':        '#bcbeff',
                        'on-secondary':               '#ffffff',
                        'on-secondary-container':     '#eeeeff',
                        'tertiary':                   '#00785a',
                        'tertiary-container':         '#00c893',
                        'on-tertiary':                '#ffffff',
                        'on-tertiary-container':      '#003828',
                        'error':                      '#ba1a1a',
                        'error-container':            '#ffdad6',
                        'on-error':                   '#ffffff',
                        'on-error-container':         '#93000a',
                        'on-surface':                 '#1c0a00',
                        'on-surface-variant':         '#5c3820',
                        'outline':                    '#9c6840',
                        'outline-variant':            '#deb896',
                        'surface-tint':               '#c23800',
                        'surface-variant':            '#e8d0bc',
                        'background':                 '#fdf6ec',
                        'inverse-surface':            '#341c08',
                        'inverse-on-surface':         '#f5ead8',
                    },
                    fontFamily: {
                        'headline': ['Plus Jakarta Sans', 'Noto Sans KR', 'sans-serif'],
                        'body':     ['Inter', 'Noto Sans KR', 'sans-serif'],
                        'label':    ['Inter', 'Noto Sans KR', 'sans-serif'],
                    },
                    borderRadius: {
                        'sm':      '6px',
                        'DEFAULT': '10px',
                        'md':      '12px',
                        'lg':      '14px',
                        'xl':      '18px',
                        '2xl':     '24px',
                        'full':    '9999px',
                    },
                },
            },
        };
    </script>

    <style>
        body { font-family: 'Inter', 'Noto Sans KR', sans-serif; }

        /* ── Brand panel diagonal clip (desktop) ── */
        @media (min-width: 1024px) {
            .brand-panel { clip-path: none; }
        }

        /* ── Keypad ── */
        .key-btn {
            transition: transform 0.08s cubic-bezier(0.4,0,0.2,1), background 0.08s;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .key-btn:active {
            transform: scale(0.89);
            box-shadow: none !important;
        }

        /* ── PIN dots ── */
        .pin-dot {
            transition: background 0.15s, transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s;
        }
        .pin-dot.filled {
            background: #c23800;
            transform: scale(1.25);
            box-shadow: 0 0 0 4px rgba(194,56,0,0.15);
            border-color: transparent;
        }

        /* ── Shake ── */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%       { transform: translateX(-7px); }
            40%       { transform: translateX(7px); }
            60%       { transform: translateX(-5px); }
            80%       { transform: translateX(5px); }
        }
        .shake { animation: shake 0.38s ease; }

        /* ── Math deco ── */
        .math-deco { font-family: 'Plus Jakarta Sans', serif; font-weight: 900; }
    </style>
</head>

<body class="bg-surface font-body text-on-surface min-h-dvh overflow-x-hidden">

    <div class="min-h-dvh flex flex-col lg:flex-row">

        <!-- ══ Brand Panel ══════════════════════════════════════════ -->
        <div class="brand-panel bg-primary text-on-primary
                    flex flex-col justify-center
                    px-8 pt-10 pb-8
                    lg:w-[44%] lg:min-h-dvh lg:px-14 lg:py-20 lg:justify-between">

            <!-- Logo + Brand -->
            <div>
                <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl
                            bg-white/15 mb-6 lg:mb-10">
                    <span class="material-symbols-outlined text-2xl"
                          style="font-variation-settings:'FILL' 1" aria-hidden="true">auto_awesome</span>
                </div>

                <h1 class="font-headline font-black leading-none tracking-tight mb-3
                           text-4xl lg:text-6xl xl:text-7xl">
                    개념<br class="hidden lg:block" /><span class="lg:hidden"> </span>가챠
                </h1>

                <p class="text-on-primary/70 text-sm leading-relaxed lg:text-base">
                    몰랐던 것을 기록하고,<br />
                    랜덤으로 꺼내서 기억하자
                </p>
            </div>

            <!-- Decorative math symbols (desktop only) -->
            <div class="hidden lg:flex gap-8 text-on-primary/15 select-none math-deco"
                 aria-hidden="true"
                 style="font-size: 3.5rem">
                <span>∑</span>
                <span>∫</span>
                <span>π</span>
                <span>√</span>
                <span>∞</span>
            </div>
        </div>

        <!-- ══ Login Panel ══════════════════════════════════════════ -->
        <div class="flex-1 flex flex-col justify-center items-center
                    px-5 py-10 lg:py-0 lg:px-8">

            <div class="w-full max-w-[330px]">

                <!-- Section label -->
                <div class="mb-7">
                    <p class="text-[11px] font-bold text-outline uppercase tracking-[0.14em] mb-1 font-label">로그인</p>
                    <p class="text-sm text-on-surface-variant">이름과 4자리 PIN을 입력하세요</p>
                </div>

                <!-- ── Name Input ── -->
                <div class="mb-5">
                    <label for="nameInput"
                           class="block text-[11px] font-bold text-outline uppercase tracking-[0.14em] mb-2 font-label">
                        이름
                    </label>
                    <input
                        type="text"
                        id="nameInput"
                        placeholder="이름을 입력하세요"
                        autocomplete="off"
                        class="w-full px-4 py-3.5 rounded-xl
                               bg-surface-container-low border-2 border-transparent
                               text-on-surface placeholder-outline text-sm font-semibold
                               focus:border-primary focus:bg-surface-container-lowest focus:outline-none
                               transition-colors"
                    />
                </div>

                <!-- ── PIN Display ── -->
                <div class="mb-5">
                    <label id="pinLabel"
                           class="block text-[11px] font-bold text-outline uppercase tracking-[0.14em] mb-4 font-label">
                        PIN
                    </label>
                    <div id="pinDots"
                         class="flex justify-center gap-5 py-1"
                         role="status" aria-live="polite" aria-labelledby="pinLabel" aria-label="PIN 0자리 입력됨">
                        <div class="pin-dot w-5 h-5 rounded-full border-2 border-outline-variant bg-transparent"></div>
                        <div class="pin-dot w-5 h-5 rounded-full border-2 border-outline-variant bg-transparent"></div>
                        <div class="pin-dot w-5 h-5 rounded-full border-2 border-outline-variant bg-transparent"></div>
                        <div class="pin-dot w-5 h-5 rounded-full border-2 border-outline-variant bg-transparent"></div>
                    </div>
                </div>

                <!-- Error -->
                <div id="errorMsg"
                     class="hidden mb-4 px-4 py-2.5 rounded-xl bg-error-container text-on-error-container
                            text-sm font-bold text-center"></div>

                <!-- ── Numeric Keypad ── -->
                <div class="grid grid-cols-3 gap-2.5 mb-6" id="keypad" role="group" aria-label="숫자 키패드">
                    <button class="key-btn h-14 rounded-xl bg-surface-container-low hover:bg-surface-container
                                   font-bold text-xl text-on-surface border border-outline-variant/40
                                   shadow-[inset_0_-2px_0_rgba(0,0,0,0.07)]
                                   focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary"
                            data-key="1">1</button>
                    <button class="key-btn h-14 rounded-xl bg-surface-container-low hover:bg-surface-container
                                   font-bold text-xl text-on-surface border border-outline-variant/40
                                   shadow-[inset_0_-2px_0_rgba(0,0,0,0.07)]
                                   focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary"
                            data-key="2">2</button>
                    <button class="key-btn h-14 rounded-xl bg-surface-container-low hover:bg-surface-container
                                   font-bold text-xl text-on-surface border border-outline-variant/40
                                   shadow-[inset_0_-2px_0_rgba(0,0,0,0.07)]
                                   focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary"
                            data-key="3">3</button>
                    <button class="key-btn h-14 rounded-xl bg-surface-container-low hover:bg-surface-container
                                   font-bold text-xl text-on-surface border border-outline-variant/40
                                   shadow-[inset_0_-2px_0_rgba(0,0,0,0.07)]
                                   focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary"
                            data-key="4">4</button>
                    <button class="key-btn h-14 rounded-xl bg-surface-container-low hover:bg-surface-container
                                   font-bold text-xl text-on-surface border border-outline-variant/40
                                   shadow-[inset_0_-2px_0_rgba(0,0,0,0.07)]
                                   focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary"
                            data-key="5">5</button>
                    <button class="key-btn h-14 rounded-xl bg-surface-container-low hover:bg-surface-container
                                   font-bold text-xl text-on-surface border border-outline-variant/40
                                   shadow-[inset_0_-2px_0_rgba(0,0,0,0.07)]
                                   focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary"
                            data-key="6">6</button>
                    <button class="key-btn h-14 rounded-xl bg-surface-container-low hover:bg-surface-container
                                   font-bold text-xl text-on-surface border border-outline-variant/40
                                   shadow-[inset_0_-2px_0_rgba(0,0,0,0.07)]
                                   focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary"
                            data-key="7">7</button>
                    <button class="key-btn h-14 rounded-xl bg-surface-container-low hover:bg-surface-container
                                   font-bold text-xl text-on-surface border border-outline-variant/40
                                   shadow-[inset_0_-2px_0_rgba(0,0,0,0.07)]
                                   focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary"
                            data-key="8">8</button>
                    <button class="key-btn h-14 rounded-xl bg-surface-container-low hover:bg-surface-container
                                   font-bold text-xl text-on-surface border border-outline-variant/40
                                   shadow-[inset_0_-2px_0_rgba(0,0,0,0.07)]
                                   focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary"
                            data-key="9">9</button>
                    <!-- Bottom row -->
                    <div aria-hidden="true"></div>
                    <button class="key-btn h-14 rounded-xl bg-surface-container-low hover:bg-surface-container
                                   font-bold text-xl text-on-surface border border-outline-variant/40
                                   shadow-[inset_0_-2px_0_rgba(0,0,0,0.07)]
                                   focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary"
                            data-key="0">0</button>
                    <button class="key-btn h-14 rounded-xl bg-surface-container-low hover:bg-surface-container
                                   flex items-center justify-center text-outline border border-outline-variant/40
                                   shadow-[inset_0_-2px_0_rgba(0,0,0,0.07)]
                                   focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary"
                            data-key="backspace" aria-label="지우기">
                        <span class="material-symbols-outlined text-xl" aria-hidden="true">backspace</span>
                    </button>
                </div>

                <!-- Hints -->
                <p class="text-[11px] text-outline text-center font-label mb-2">
                    4자리 PIN 입력 시 자동으로 로그인됩니다
                </p>
                <a href="admin.html"
                   class="block text-center text-[11px] text-secondary font-bold hover:underline font-label">
                    선생님이신가요? 관리자 페이지 →
                </a>

            </div>
        </div>

    </div><!-- end flex row -->

    <script type="module" src="js/api.js"></script>
    <script>
        let pin = '';

        function pressKey(digit) {
            if (pin.length >= 4) return;
            pin += digit;
            updateDots();
            if (pin.length === 4) setTimeout(doLogin, 120);
        }

        function pressBackspace() {
            pin = pin.slice(0, -1);
            updateDots();
            hideError();
        }

        function updateDots() {
            const dots = document.querySelectorAll('#pinDots .pin-dot');
            dots.forEach((dot, i) => {
                if (i < pin.length) dot.classList.add('filled');
                else dot.classList.remove('filled');
            });
            document.getElementById('pinDots').setAttribute('aria-label', `PIN ${pin.length}자리 입력됨`);
        }

        // Event delegation for keypad
        document.getElementById('keypad').addEventListener('click', (e) => {
            const btn = e.target.closest('[data-key]');
            if (!btn) return;
            const key = btn.dataset.key;
            if (key === 'backspace') pressBackspace();
            else pressKey(key);
        });

        function showError(msg) {
            const el = document.getElementById('errorMsg');
            el.textContent = msg;
            el.classList.remove('hidden');
            const dots = document.getElementById('pinDots');
            dots.classList.add('shake');
            setTimeout(() => dots.classList.remove('shake'), 400);
            pin = '';
            updateDots();
        }

        function hideError() {
            document.getElementById('errorMsg').classList.add('hidden');
        }

        async function doLogin() {
            const name = document.getElementById('nameInput').value.trim();
            if (!name) {
                showError('이름을 입력해주세요');
                document.getElementById('nameInput').focus();
                return;
            }
            try {
                const student = await API.login(name, pin);
                sessionStorage.setItem('currentStudent', JSON.stringify({ id: student.id, name: student.name }));
                window.location.href = 'gacha.html';
            } catch (e) {
                showError(e.message || '로그인 실패');
            }
        }

        // Keyboard support
        document.getElementById('nameInput').addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') pressKey(e.key);
            else if (e.key === 'Backspace' && e.target.value === '') pressBackspace();
        });

        if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
        }
    </script>
</body>

</html>
