<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>개념 가챠 - 학생 선택</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <style>
        body { font-family: 'Inter', 'Noto Sans KR', sans-serif; }
    </style>
</head>

<body class="bg-gradient-to-br from-orange-50 to-red-50 dark:from-slate-950 dark:to-slate-900 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md">
        <!-- Logo -->
        <div class="text-center mb-10">
            <h1 class="text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-orange-500 to-red-600 mb-2">개념 가챠</h1>
            <p class="text-slate-500 dark:text-slate-400 text-sm">몰랐던 것을 기록하고, 랜덤으로 꺼내서 기억하자</p>
        </div>

        <!-- Student List -->
        <div class="bg-white dark:bg-slate-900 rounded-[2rem] shadow-2xl border border-slate-100 dark:border-slate-800 p-8 mb-4">
            <h2 class="text-lg font-bold text-slate-700 dark:text-slate-300 mb-5 flex items-center gap-2">
                <span class="material-symbols-outlined text-orange-500">person</span>
                학생 선택
            </h2>
            <div id="studentList" class="space-y-3 mb-6">
                <div class="text-center py-6 text-slate-400 text-sm">불러오는 중...</div>
            </div>

            <!-- Add Student -->
            <div class="flex gap-2">
                <input
                    type="text"
                    id="newStudentName"
                    placeholder="새 학생 이름"
                    class="flex-1 px-4 py-3 rounded-xl border border-slate-100 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 focus:ring-2 focus:ring-orange-500 outline-none text-sm"
                    onkeydown="if(event.key==='Enter') addStudent()"
                />
                <button
                    onclick="addStudent()"
                    class="px-5 py-3 rounded-xl bg-gradient-to-r from-orange-500 to-red-600 text-white font-bold text-sm hover:opacity-90 transition-all shadow-lg shadow-orange-500/20">
                    추가
                </button>
            </div>
        </div>

        <p class="text-center text-xs text-slate-400">학생을 선택하면 학습을 시작합니다</p>
    </div>

    <script type="module" src="js/api.js"></script>
    <script type="module">
        window.selectStudent = function(id, name) {
            localStorage.setItem('currentStudent', JSON.stringify({ id, name }));
            window.location.href = 'gacha.html';
        };

        window.addStudent = async function() {
            const input = document.getElementById('newStudentName');
            const name = input.value.trim();
            if (!name) return;
            try {
                await API.addStudent(name);
                input.value = '';
                loadStudents();
            } catch (e) {
                alert('추가 실패: ' + e.message);
            }
        };

        async function loadStudents() {
            const list = document.getElementById('studentList');
            try {
                const students = await API.getStudents();
                if (students.length === 0) {
                    list.innerHTML = '<div class="text-center py-6 text-slate-400 text-sm">등록된 학생이 없습니다.<br/>아래에서 학생을 추가하세요.</div>';
                    return;
                }
                list.innerHTML = students.map(s => `
                    <button
                        onclick="selectStudent('${s.id}', '${s.name.replace(/'/g, "\\'")}')"
                        class="w-full flex items-center gap-4 px-5 py-4 rounded-2xl border border-slate-100 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 hover:border-orange-300 hover:bg-orange-50 dark:hover:bg-orange-900/10 transition-all group text-left">
                        <div class="w-10 h-10 rounded-full bg-orange-100 dark:bg-orange-900/20 text-orange-600 flex items-center justify-center font-black text-lg group-hover:scale-110 transition-transform">
                            ${s.name.charAt(0)}
                        </div>
                        <span class="flex-1 font-bold text-slate-800 dark:text-slate-200">${s.name}</span>
                        <span class="material-symbols-outlined text-slate-300 group-hover:text-orange-400 transition-colors">arrow_forward_ios</span>
                    </button>
                `).join('');
            } catch (e) {
                list.innerHTML = '<div class="text-center py-6 text-red-400 text-sm">로드 실패</div>';
            }
        }

        if (window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.classList.add('dark');
        loadStudents();
    </script>
</body>

</html>
