<!DOCTYPE html>
<html class="light" lang="ko">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>개념 가챠 - 로그인</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

    <script id="tailwind-config">
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'surface':                    '#f7f9fb',
                        'surface-bright':             '#f7f9fb',
                        'surface-dim':                '#d8dadc',
                        'surface-container-lowest':   '#ffffff',
                        'surface-container-low':      '#f2f4f6',
                        'surface-container':          '#eceef0',
                        'surface-container-high':     '#e6e8ea',
                        'surface-container-highest':  '#e0e3e5',
                        'primary':                    '#9d4300',
                        'primary-container':          '#f97316',
                        'primary-fixed':              '#ffdbca',
                        'primary-fixed-dim':          '#ffb690',
                        'on-primary':                 '#ffffff',
                        'on-primary-container':       '#582200',
                        'secondary':                  '#4648d4',
                        'secondary-container':        '#6063ee',
                        'secondary-fixed':            '#e1e0ff',
                        'secondary-fixed-dim':        '#c0c1ff',
                        'on-secondary':               '#ffffff',
                        'on-secondary-container':     '#fffbff',
                        'tertiary':                   '#006c49',
                        'tertiary-container':         '#00b07a',
                        'on-tertiary':                '#ffffff',
                        'on-tertiary-container':      '#003b26',
                        'error':                      '#ba1a1a',
                        'error-container':            '#ffdad6',
                        'on-error':                   '#ffffff',
                        'on-error-container':         '#93000a',
                        'on-surface':                 '#191c1e',
                        'on-surface-variant':         '#584237',
                        'outline':                    '#8c7164',
                        'outline-variant':            '#e0c0b1',
                        'surface-tint':               '#9d4300',
                        'surface-variant':            '#e0e3e5',
                        'background':                 '#f7f9fb',
                        'inverse-surface':            '#2d3133',
                        'inverse-on-surface':         '#eff1f3',
                    },
                    fontFamily: {
                        'headline': ['Plus Jakarta Sans', 'Noto Sans KR', 'sans-serif'],
                        'body':     ['Inter', 'Noto Sans KR', 'sans-serif'],
                        'label':    ['Inter', 'Noto Sans KR', 'sans-serif'],
                    },
                    borderRadius: {
                        'DEFAULT': '0.75rem',
                        'lg': '1rem',
                        'xl': '1.25rem',
                        '2xl': '1.5rem',
                        'full': '9999px',
                    },
                },
            },
        };
    </script>

    <style>
        body { font-family: 'Inter', 'Noto Sans KR', sans-serif; min-height: 100dvh; }
        .font-headline { font-family: 'Plus Jakarta Sans', 'Noto Sans KR', sans-serif; }
        .glass {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .key-btn {
            transition: transform 0.08s, background 0.08s;
            user-select: none;
            -webkit-user-select: none;
        }
        .key-btn:active { transform: scale(0.92); }
        .pin-dot {
            transition: background 0.15s, transform 0.15s;
        }
        .pin-dot.filled {
            background: #9d4300;
            transform: scale(1.15);
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%       { transform: translateX(-8px); }
            40%       { transform: translateX(8px); }
            60%       { transform: translateX(-6px); }
            80%       { transform: translateX(6px); }
        }
        .shake { animation: shake 0.4s ease; }
    </style>
</head>

<body class="bg-surface font-body text-on-surface overflow-x-hidden flex items-center justify-center min-h-dvh p-4">

    <!-- ── Ambient Orbs ───────────────────────────────────────── -->
    <div class="fixed top-0 -left-24 w-96 h-96 rounded-full pointer-events-none -z-10"
        style="background:rgba(255,219,202,0.35); filter:blur(100px);"></div>
    <div class="fixed bottom-0 -right-24 w-80 h-80 rounded-full pointer-events-none -z-10"
        style="background:rgba(225,224,255,0.25); filter:blur(100px);"></div>

    <div class="w-full max-w-sm py-8">

        <!-- ── Brand Hero ─────────────────────────────────────── -->
        <div class="text-center mb-8 px-4">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full mb-4
                        shadow-[0px_8px_24px_rgba(157,67,0,0.28)]"
                style="background: linear-gradient(135deg, #9d4300, #f97316)">
                <span class="material-symbols-outlined text-white text-2xl"
                    style="font-variation-settings:'FILL' 1">auto_awesome</span>
            </div>
            <h1 class="font-headline text-3xl font-bold text-primary mb-1 tracking-tight">Concept Gacha</h1>
            <p class="text-on-surface-variant text-xs">이름과 PIN으로 로그인하세요</p>
        </div>

        <!-- ── Login Card ─────────────────────────────────────── -->
        <div class="bg-surface-container-lowest rounded-2xl overflow-hidden
                    shadow-[0px_16px_40px_rgba(88,66,55,0.08)]">

            <div class="px-7 pt-7 pb-5 space-y-5">

                <!-- Name Input -->
                <div>
                    <label class="text-xs font-bold text-outline uppercase tracking-widest mb-2 block">이름</label>
                    <input
                        type="text"
                        id="nameInput"
                        placeholder="이름을 입력하세요"
                        autocomplete="off"
                        class="w-full px-4 py-3 rounded-DEFAULT
                               bg-surface-container-low border-0 outline-none
                               text-on-surface placeholder-outline text-sm font-bold
                               focus:bg-white focus:ring-2 focus:ring-primary/20
                               transition-colors"
                    />
                </div>

                <!-- PIN Display -->
                <div>
                    <label class="text-xs font-bold text-outline uppercase tracking-widest mb-3 block">PIN</label>
                    <div id="pinDots" class="flex justify-center gap-4 py-2">
                        <div class="pin-dot w-4 h-4 rounded-full border-2 border-outline-variant bg-transparent"></div>
                        <div class="pin-dot w-4 h-4 rounded-full border-2 border-outline-variant bg-transparent"></div>
                        <div class="pin-dot w-4 h-4 rounded-full border-2 border-outline-variant bg-transparent"></div>
                        <div class="pin-dot w-4 h-4 rounded-full border-2 border-outline-variant bg-transparent"></div>
                    </div>
                </div>
            </div>

            <!-- Error message -->
            <div id="errorMsg" class="hidden mx-7 mb-3 px-4 py-2.5 rounded-DEFAULT bg-error-container text-on-error-container text-sm font-bold text-center"></div>

            <!-- ── Numeric Keypad ──────────────────────────────── -->
            <div class="px-7 pb-7">
                <div class="grid grid-cols-3 gap-2.5">
                    <!-- 1-9 -->
                    <button class="key-btn h-14 rounded-DEFAULT bg-surface-container-low hover:bg-surface-container font-bold text-xl text-on-surface" onclick="pressKey('1')">1</button>
                    <button class="key-btn h-14 rounded-DEFAULT bg-surface-container-low hover:bg-surface-container font-bold text-xl text-on-surface" onclick="pressKey('2')">2</button>
                    <button class="key-btn h-14 rounded-DEFAULT bg-surface-container-low hover:bg-surface-container font-bold text-xl text-on-surface" onclick="pressKey('3')">3</button>
                    <button class="key-btn h-14 rounded-DEFAULT bg-surface-container-low hover:bg-surface-container font-bold text-xl text-on-surface" onclick="pressKey('4')">4</button>
                    <button class="key-btn h-14 rounded-DEFAULT bg-surface-container-low hover:bg-surface-container font-bold text-xl text-on-surface" onclick="pressKey('5')">5</button>
                    <button class="key-btn h-14 rounded-DEFAULT bg-surface-container-low hover:bg-surface-container font-bold text-xl text-on-surface" onclick="pressKey('6')">6</button>
                    <button class="key-btn h-14 rounded-DEFAULT bg-surface-container-low hover:bg-surface-container font-bold text-xl text-on-surface" onclick="pressKey('7')">7</button>
                    <button class="key-btn h-14 rounded-DEFAULT bg-surface-container-low hover:bg-surface-container font-bold text-xl text-on-surface" onclick="pressKey('8')">8</button>
                    <button class="key-btn h-14 rounded-DEFAULT bg-surface-container-low hover:bg-surface-container font-bold text-xl text-on-surface" onclick="pressKey('9')">9</button>
                    <!-- Bottom row -->
                    <div></div>
                    <button class="key-btn h-14 rounded-DEFAULT bg-surface-container-low hover:bg-surface-container font-bold text-xl text-on-surface" onclick="pressKey('0')">0</button>
                    <button class="key-btn h-14 rounded-DEFAULT bg-surface-container-low hover:bg-surface-container flex items-center justify-center text-outline" onclick="pressBackspace()">
                        <span class="material-symbols-outlined text-xl">backspace</span>
                    </button>
                </div>
            </div>

            <!-- Bottom hint -->
            <div class="px-7 pb-5 bg-surface-container-low/40">
                <p class="text-xs text-outline text-center pt-4">4자리 PIN 입력 시 자동으로 로그인됩니다</p>
                <a href="admin.html" class="block text-center text-xs text-secondary mt-2 font-bold hover:underline">선생님이신가요? 관리자 페이지 →</a>
            </div>
        </div>
    </div>

    <script type="module" src="js/api.js"></script>
    <script>
        let pin = '';

        function pressKey(digit) {
            if (pin.length >= 4) return;
            pin += digit;
            updateDots();
            if (pin.length === 4) setTimeout(doLogin, 120);
        }

        function pressBackspace() {
            pin = pin.slice(0, -1);
            updateDots();
            hideError();
        }

        function updateDots() {
            const dots = document.querySelectorAll('#pinDots .pin-dot');
            dots.forEach((dot, i) => {
                if (i < pin.length) {
                    dot.classList.add('filled');
                    dot.style.borderColor = '#9d4300';
                } else {
                    dot.classList.remove('filled');
                    dot.style.borderColor = '';
                }
            });
        }

        function showError(msg) {
            const el = document.getElementById('errorMsg');
            el.textContent = msg;
            el.classList.remove('hidden');
            const dots = document.getElementById('pinDots');
            dots.classList.add('shake');
            setTimeout(() => dots.classList.remove('shake'), 400);
            pin = '';
            updateDots();
        }

        function hideError() {
            document.getElementById('errorMsg').classList.add('hidden');
        }

        async function doLogin() {
            const name = document.getElementById('nameInput').value.trim();
            if (!name) {
                showError('이름을 입력해주세요');
                document.getElementById('nameInput').focus();
                return;
            }
            try {
                const student = await API.login(name, pin);
                localStorage.setItem('currentStudent', JSON.stringify({ id: student.id, name: student.name }));
                window.location.href = 'gacha.html';
            } catch (e) {
                showError(e.message || '로그인 실패');
            }
        }

        // keyboard support
        document.getElementById('nameInput').addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') pressKey(e.key);
            else if (e.key === 'Backspace' && e.target.value === '') pressBackspace();
        });

        if (window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.classList.add('dark');
    </script>
</body>

</html>
