<!DOCTYPE html>
<html class="light" lang="ko">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>개념 가챠 - 학생 선택</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

    <script id="tailwind-config">
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'surface':                    '#f7f9fb',
                        'surface-bright':             '#f7f9fb',
                        'surface-dim':                '#d8dadc',
                        'surface-container-lowest':   '#ffffff',
                        'surface-container-low':      '#f2f4f6',
                        'surface-container':          '#eceef0',
                        'surface-container-high':     '#e6e8ea',
                        'surface-container-highest':  '#e0e3e5',
                        'primary':                    '#9d4300',
                        'primary-container':          '#f97316',
                        'primary-fixed':              '#ffdbca',
                        'primary-fixed-dim':          '#ffb690',
                        'on-primary':                 '#ffffff',
                        'on-primary-container':       '#582200',
                        'secondary':                  '#4648d4',
                        'secondary-container':        '#6063ee',
                        'secondary-fixed':            '#e1e0ff',
                        'secondary-fixed-dim':        '#c0c1ff',
                        'on-secondary':               '#ffffff',
                        'on-secondary-container':     '#fffbff',
                        'tertiary':                   '#006c49',
                        'tertiary-container':         '#00b07a',
                        'on-tertiary':                '#ffffff',
                        'on-tertiary-container':      '#003b26',
                        'error':                      '#ba1a1a',
                        'error-container':            '#ffdad6',
                        'on-error':                   '#ffffff',
                        'on-error-container':         '#93000a',
                        'on-surface':                 '#191c1e',
                        'on-surface-variant':         '#584237',
                        'outline':                    '#8c7164',
                        'outline-variant':            '#e0c0b1',
                        'surface-tint':               '#9d4300',
                        'surface-variant':            '#e0e3e5',
                        'background':                 '#f7f9fb',
                        'inverse-surface':            '#2d3133',
                        'inverse-on-surface':         '#eff1f3',
                    },
                    fontFamily: {
                        'headline': ['Plus Jakarta Sans', 'Noto Sans KR', 'sans-serif'],
                        'body':     ['Inter', 'Noto Sans KR', 'sans-serif'],
                        'label':    ['Inter', 'Noto Sans KR', 'sans-serif'],
                    },
                    borderRadius: {
                        'DEFAULT': '1rem',
                        'lg': '2rem',
                        'xl': '3rem',
                        'full': '9999px',
                    },
                },
            },
        };
    </script>

    <style>
        body { font-family: 'Inter', 'Noto Sans KR', sans-serif; min-height: 100dvh; }
        .font-headline { font-family: 'Plus Jakarta Sans', 'Noto Sans KR', sans-serif; }
        .glass {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .student-btn:hover .student-avatar { transform: scale(1.1); }
        .student-avatar { transition: transform 0.2s; }
    </style>
</head>

<body class="bg-surface font-body text-on-surface overflow-x-hidden flex items-center justify-center min-h-dvh p-4">

    <!-- ── Ambient Orbs ───────────────────────────────────────── -->
    <div class="fixed top-0 -left-24 w-96 h-96 rounded-full pointer-events-none -z-10"
        style="background:rgba(255,219,202,0.35); filter:blur(100px);"></div>
    <div class="fixed bottom-0 -right-24 w-80 h-80 rounded-full pointer-events-none -z-10"
        style="background:rgba(225,224,255,0.25); filter:blur(100px);"></div>

    <div class="w-full max-w-md py-12">

        <!-- ── Brand Hero ─────────────────────────────────────── -->
        <div class="text-center mb-10 px-4">
            <div class="inline-flex items-center justify-center w-20 h-20 rounded-full mb-4
                        shadow-[0px_10px_30px_rgba(157,67,0,0.30)]"
                style="background: linear-gradient(135deg, #9d4300, #f97316)">
                <span class="material-symbols-outlined text-white text-3xl"
                    style="font-variation-settings:'FILL' 1">auto_awesome</span>
            </div>
            <h1 class="font-headline text-4xl font-bold text-primary mb-2 tracking-tight">Concept Gacha</h1>
            <p class="text-on-surface-variant text-sm leading-relaxed">
                몰랐던 것을 기록하고<br/>랜덤으로 꺼내서 기억하자
            </p>
        </div>

        <!-- ── Student Card ───────────────────────────────────── -->
        <div class="bg-surface-container-lowest rounded-xl overflow-hidden
                    shadow-[0px_20px_40px_rgba(88,66,55,0.06)]">

            <!-- Header -->
            <div class="px-8 pt-8 pb-4">
                <div class="flex items-center gap-2 mb-5">
                    <span class="material-symbols-outlined text-secondary-container text-xl"
                        style="font-variation-settings:'FILL' 1">group</span>
                    <h2 class="font-headline text-lg font-bold text-on-surface">학생 선택</h2>
                </div>

                <!-- Student List -->
                <div id="studentList" class="space-y-2.5 mb-6">
                    <div class="text-center py-8 text-outline text-sm">불러오는 중...</div>
                </div>

                <!-- Add Student -->
                <div class="flex gap-2">
                    <input
                        type="text"
                        id="newStudentName"
                        placeholder="새 학생 이름"
                        class="flex-1 px-4 py-3 rounded-DEFAULT
                               bg-surface-container-low border-0 outline-none
                               text-on-surface placeholder-outline text-sm
                               focus:bg-surface-container transition-colors
                               focus:ring-2 focus:ring-primary/20"
                        onkeydown="if(event.key==='Enter') addStudent()"
                    />
                    <button
                        onclick="addStudent()"
                        class="px-5 py-3 rounded-DEFAULT text-on-primary font-bold text-sm
                               transition-all active:scale-95 shadow-[0_6px_20px_rgba(157,67,0,0.25)]"
                        style="background: linear-gradient(135deg, #9d4300, #f97316)">
                        추가
                    </button>
                </div>
            </div>

            <!-- Footer hint -->
            <div class="px-8 py-4 bg-surface-container-low/50">
                <p class="text-xs text-outline text-center">학생을 선택하면 학습을 시작합니다</p>
            </div>
        </div>

    </div>

    <script type="module" src="js/api.js"></script>
    <script type="module">
        window.selectStudent = function(id, name) {
            localStorage.setItem('currentStudent', JSON.stringify({ id, name }));
            window.location.href = 'gacha.html';
        };

        window.addStudent = async function() {
            const input = document.getElementById('newStudentName');
            const name = input.value.trim();
            if (!name) return;
            try {
                await API.addStudent(name);
                input.value = '';
                loadStudents();
            } catch (e) {
                alert('추가 실패: ' + e.message);
            }
        };

        async function loadStudents() {
            const list = document.getElementById('studentList');
            try {
                const students = await API.getStudents();
                if (students.length === 0) {
                    list.innerHTML = `
                        <div class="text-center py-8 text-outline text-sm">
                            <span class="material-symbols-outlined block text-3xl mb-2 text-surface-dim">person_add</span>
                            등록된 학생이 없습니다.<br/>아래에서 학생을 추가하세요.
                        </div>`;
                    return;
                }
                list.innerHTML = students.map(s => `
                    <button
                        onclick="selectStudent('${s.id}', '${s.name.replace(/'/g, "\\'")}')"
                        class="student-btn w-full flex items-center gap-4 px-5 py-4 rounded-DEFAULT
                               bg-surface-container-low hover:bg-primary-fixed/40
                               transition-all active:scale-98 text-left group">
                        <div class="student-avatar w-10 h-10 rounded-full
                                    bg-primary-fixed text-primary
                                    flex items-center justify-center font-bold text-lg font-headline">
                            ${s.name.charAt(0)}
                        </div>
                        <span class="flex-1 font-bold text-on-surface">${s.name}</span>
                        <span class="material-symbols-outlined text-outline group-hover:text-primary transition-colors">arrow_forward_ios</span>
                    </button>
                `).join('');
            } catch (e) {
                list.innerHTML = '<div class="text-center py-6 text-error text-sm">로드 실패</div>';
            }
        }

        if (window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.classList.add('dark');
        loadStudents();
    </script>
</body>

</html>
