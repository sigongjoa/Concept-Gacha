<!DOCTYPE html>
<html class="light" lang="ko">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>개념 가챠 - 전체 목록</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

    <script id="tailwind-config">
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'surface':                    '#fdf6ec',
                        'surface-bright':             '#fdf6ec',
                        'surface-dim':                '#e8d9c8',
                        'surface-container-lowest':   '#ffffff',
                        'surface-container-low':      '#f5ead8',
                        'surface-container':          '#ecdece',
                        'surface-container-high':     '#e2d0be',
                        'surface-container-highest':  '#d8c4b0',
                        'primary':                    '#c23800',
                        'primary-container':          '#ff6535',
                        'primary-fixed':              '#ffe8d9',
                        'primary-fixed-dim':          '#ffb899',
                        'on-primary':                 '#ffffff',
                        'on-primary-container':       '#5c1500',
                        'secondary':                  '#2a2b96',
                        'secondary-container':        '#5254e8',
                        'secondary-fixed':            '#e0e1ff',
                        'secondary-fixed-dim':        '#bcbeff',
                        'on-secondary':               '#ffffff',
                        'on-secondary-container':     '#eeeeff',
                        'tertiary':                   '#00785a',
                        'tertiary-container':         '#00c893',
                        'on-tertiary':                '#ffffff',
                        'on-tertiary-container':      '#003828',
                        'error':                      '#ba1a1a',
                        'error-container':            '#ffdad6',
                        'on-error':                   '#ffffff',
                        'on-error-container':         '#93000a',
                        'on-surface':                 '#1c0a00',
                        'on-surface-variant':         '#5c3820',
                        'outline':                    '#9c6840',
                        'outline-variant':            '#deb896',
                        'surface-tint':               '#c23800',
                        'surface-variant':            '#e8d0bc',
                        'background':                 '#fdf6ec',
                        'inverse-surface':            '#341c08',
                        'inverse-on-surface':         '#f5ead8',
                    },
                    fontFamily: {
                        'headline': ['Plus Jakarta Sans', 'Noto Sans KR', 'sans-serif'],
                        'body':     ['Inter', 'Noto Sans KR', 'sans-serif'],
                        'label':    ['Inter', 'Noto Sans KR', 'sans-serif'],
                    },
                    borderRadius: {
                        'sm': '6px', 'DEFAULT': '10px', 'lg': '14px',
                        'xl': '18px', '2xl': '24px', 'full': '9999px',
                    },
                },
            },
        };
    </script>

    <style>
        body { font-family: 'Inter', 'Noto Sans KR', sans-serif; min-height: 100dvh; }
        .font-headline { font-family: 'Plus Jakarta Sans', 'Noto Sans KR', sans-serif; }
    </style>
</head>

<body class="bg-surface font-body text-on-surface overflow-x-hidden">

    <!-- ── TopAppBar ──────────────────────────────────────────── -->
    <header class="fixed top-0 w-full z-50 bg-surface-container-lowest border-b border-outline-variant/30">
        <div class="flex justify-between items-center px-5 h-14 max-w-2xl mx-auto">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-full bg-primary-fixed flex items-center justify-center flex-shrink-0">
                    <span class="font-bold text-primary text-xs font-headline" id="studentInitial">?</span>
                </div>
                <span class="font-headline font-bold text-primary tracking-tight">전체 목록</span>
            </div>
            <button onclick="document.documentElement.classList.toggle('dark')"
                class="w-9 h-9 flex items-center justify-center rounded-xl hover:bg-surface-container-low transition-colors active:scale-90 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary"
                aria-label="다크모드 전환">
                <span class="material-symbols-outlined text-[20px] text-on-surface-variant" aria-hidden="true">dark_mode</span>
            </button>
        </div>
    </header>

    <!-- Sidebar placeholder (layout.js 호환용) -->
    <aside id="sidebarInjected" class="hidden"></aside>

    <!-- ── Main Content ──────────────────────────────────────── -->
    <main class="pt-20 pb-36 px-6 max-w-2xl mx-auto space-y-6">

        <!-- Page Title -->
        <div class="mt-4">
            <h2 class="font-headline text-2xl font-bold text-on-surface">전체 카드 목록</h2>
        </div>

        <!-- ── Card List ───────────────────────────────────────── -->
        <div class="bg-surface-container-lowest rounded-xl overflow-hidden
                    shadow-[0px_20px_40px_rgba(88,66,55,0.06)]">

            <!-- Stats bar -->
            <div class="px-6 py-4 bg-surface-container-low flex items-center gap-3">
                <span class="material-symbols-outlined text-secondary-container text-xl"
                    style="font-variation-settings:'FILL' 1">style</span>
                <span class="font-bold text-on-surface-variant text-sm" id="cardCount">0개의 카드</span>
                <div class="flex-1"></div>
                <!-- Box legend -->
                <div class="flex items-center gap-2 text-xs text-outline font-label font-bold">
                    <span class="w-2 h-2 rounded-full bg-red-400 inline-block"></span>1
                    <span class="w-2 h-2 rounded-full bg-yellow-400 inline-block ml-1"></span>2
                    <span class="w-2 h-2 rounded-full bg-blue-400 inline-block ml-1"></span>3
                    <span class="w-2 h-2 rounded-full bg-emerald-400 inline-block ml-1"></span>4
                </div>
            </div>

            <!-- List -->
            <div class="divide-y divide-surface-container-low" id="cardList">
                <div class="text-center py-16 text-outline">
                    <span class="material-symbols-outlined text-4xl block mb-2 text-surface-dim">hourglass_empty</span>
                    데이터를 불러오는 중...
                </div>
            </div>

        </div>

    </main>

    <!-- ── Bottom Navigation ──────────────────────────────────── -->
    <nav class="fixed bottom-0 left-0 w-full z-40
                flex justify-around items-center
                px-4 pb-8 pt-4
                bg-surface-container-lowest border-t border-outline-variant/30">
        <a href="index.html"
            class="flex flex-col items-center gap-0.5 p-2 text-outline hover:text-primary rounded-xl transition-colors active:scale-90">
            <span class="material-symbols-outlined">group</span>
            <span class="font-bold text-[11px] mt-0.5 font-label">학생</span>
        </a>
        <a href="gacha.html"
            class="flex flex-col items-center gap-0.5 p-2 text-outline hover:text-primary rounded-xl transition-colors active:scale-90">
            <span class="material-symbols-outlined">auto_awesome</span>
            <span class="font-bold text-[11px] mt-0.5 font-label">뽑기</span>
        </a>
        <a href="add.html"
            class="flex flex-col items-center gap-0.5 p-2 text-outline hover:text-primary rounded-xl transition-colors active:scale-90">
            <span class="material-symbols-outlined">add_circle</span>
            <span class="font-bold text-[11px] mt-0.5 font-label">추가</span>
        </a>
        <div class="flex flex-col items-center gap-0.5 px-4 py-1.5 rounded-full bg-primary-fixed text-primary" aria-current="page">
            <span class="material-symbols-outlined" style="font-variation-settings:'FILL' 1">style</span>
            <span class="font-bold text-[11px] mt-0.5 font-label">목록</span>
        </div>
        <a href="admin.html"
            class="flex flex-col items-center gap-0.5 p-2 text-outline hover:text-primary rounded-xl transition-colors active:scale-90">
            <span class="material-symbols-outlined">settings</span>
            <span class="font-bold text-[11px] mt-0.5 font-label">관리</span>
        </a>
    </nav>

    <script type="module" src="js/api.js"></script>
    <script src="js/layout.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            Layout.init();
            const s = Layout.currentStudent;
            if (s) document.getElementById('studentInitial').textContent = s.name.charAt(0);
            loadCardList();
        });

        async function loadCardList() {
            if (!Layout.currentStudent) return;
            const container = document.getElementById('cardList');
            try {
                const cards = await API.getCards(Layout.currentStudent.id);
                document.getElementById('cardCount').textContent = `${cards.length}개의 카드`;

                if (cards.length === 0) {
                    container.innerHTML = `
                        <div class="text-center py-16 text-outline">
                            <span class="material-symbols-outlined text-4xl block mb-2 text-surface-dim">style</span>
                            등록된 카드가 없습니다
                        </div>`;
                    return;
                }

                // box color dots
                const boxDotColors = ['', '#f87171', '#facc15', '#60a5fa', '#34d399', '#f97316'];
                const boxBgColors  = ['', 'rgba(248,113,113,0.10)', 'rgba(250,204,21,0.12)', 'rgba(96,165,250,0.10)', 'rgba(52,211,153,0.10)', 'rgba(249,115,22,0.10)'];
                const boxTextColors= ['', '#b91c1c', '#92400e', '#1d4ed8', '#065f46', '#9d4300'];

                container.innerHTML = cards.map(c => `
                    <div class="flex items-center gap-4 px-6 py-4 hover:bg-surface-container-low/60 transition-colors">
                        <div class="flex-1 flex items-center gap-4">
                            ${c.type === 'image'
                                ? `<img src="assets/${c.questionImage}" class="h-14 w-14 object-cover rounded-DEFAULT shadow-sm flex-shrink-0"/>`
                                : `<div class="h-14 w-14 bg-primary-fixed rounded-DEFAULT flex items-center justify-center flex-shrink-0">
                                       <span class="material-symbols-outlined text-primary">description</span>
                                   </div>`
                            }
                            <div class="flex-1 overflow-hidden">
                                <h3 class="font-bold text-on-surface truncate">
                                    ${c.type === 'text' ? Layout.escapeHtml(c.question) : '이미지 질문'}
                                </h3>
                                <p class="text-sm text-outline mt-0.5 truncate">정답: ${Layout.escapeHtml(c.answer)}</p>
                                ${c.explanation ? `<p class="text-xs text-secondary/70 mt-0.5 truncate">${Layout.escapeHtml(c.explanation)}</p>` : ''}
                            </div>
                        </div>
                        <div class="flex items-center gap-2 flex-shrink-0">
                            <span class="px-3 py-1 rounded-full text-xs font-bold font-label"
                                  style="background:${boxBgColors[c.box] || 'rgba(88,66,55,0.08)'}; color:${boxTextColors[c.box] || '#584237'}">
                                <span class="inline-block w-1.5 h-1.5 rounded-full mr-1 align-middle"
                                      style="background:${boxDotColors[c.box] || '#8c7164'}"></span>상자 ${c.box}
                            </span>
                            <button onclick="deleteCard('${c.id}')"
                                class="w-9 h-9 flex items-center justify-center rounded-full
                                       text-outline hover:text-on-error-container hover:bg-error-container
                                       transition-all active:scale-90">
                                <span class="material-symbols-outlined text-[20px]">delete</span>
                            </button>
                        </div>
                    </div>
                `).join('');
            } catch (e) {
                container.innerHTML = `
                    <div class="text-center py-16 text-error">
                        <span class="material-symbols-outlined text-4xl block mb-2">error</span>
                        데이터 로드 실패
                    </div>`;
            }
        }

        async function deleteCard(id) {
            if (!confirm('정말 삭제하시겠습니까?')) return;
            try {
                await API.deleteCard(id);
                Layout.showToast('삭제되었습니다');
                loadCardList();
                Layout.loadStats();
            } catch (e) {
                Layout.showToast('삭제 실패', true);
            }
        }

        if (window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.classList.add('dark');
    </script>
</body>

</html>
