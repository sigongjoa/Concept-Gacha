<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - Concept Gacha</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
        }
    </style>
</head>

<body class="bg-gradient-to-br from-purple-50 to-blue-50 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full">
        <!-- 로고 -->
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-purple-600 mb-2">🎴 Concept Gacha</h1>
            <p class="text-gray-600">학습 카드 관리 시스템</p>
        </div>

        <!-- 로그인 카드 -->
        <div class="bg-white rounded-2xl shadow-xl p-8">
            <h2 class="text-2xl font-bold text-gray-800 mb-6">로그인</h2>

            <!-- 에러 메시지 -->
            <div id="errorMessage" class="hidden mb-4 p-4 bg-red-50 border border-red-200 rounded-lg">
                <p class="text-red-600 text-sm"></p>
            </div>

            <!-- 로그인 폼 -->
            <form id="loginForm" class="space-y-4">
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
                        이메일
                    </label>
                    <input type="email" id="email" name="email" required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none transition"
                        placeholder="your@email.com">
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
                        비밀번호
                    </label>
                    <input type="password" id="password" name="password" required minlength="6"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none transition"
                        placeholder="최소 6자 이상">
                </div>

                <button type="submit" id="loginButton"
                    class="w-full bg-purple-600 hover:bg-purple-700 text-white font-medium py-3 rounded-lg transition duration-200 transform hover:scale-[1.02] active:scale-[0.98]">
                    로그인
                </button>
            </form>

            <!-- 회원가입 링크 -->
            <div class="mt-6 text-center">
                <p class="text-gray-600">
                    계정이 없으신가요?
                    <a href="signup.html" class="text-purple-600 hover:text-purple-700 font-medium">
                        회원가입
                    </a>
                </p>
            </div>
        </div>

        <!-- 푸터 -->
        <div class="mt-8 text-center text-sm text-gray-500">
            <p>© 2024 Concept Gacha. All rights reserved.</p>
        </div>
    </div>

    <script type="module">
        import { supabase } from './js/supabase-client.js'
        import { getCurrentUser } from './js/auth.js'

        // 이미 로그인된 경우 리다이렉트
        const user = await getCurrentUser()
        if (user) {
            const urlParams = new URLSearchParams(window.location.search)
            const redirect = urlParams.get('redirect') || '/gacha.html'
            window.location.href = redirect
        }

        const loginForm = document.getElementById('loginForm')
        const loginButton = document.getElementById('loginButton')
        const errorMessage = document.getElementById('errorMessage')

        function showError(message) {
            errorMessage.classList.remove('hidden')
            errorMessage.querySelector('p').textContent = message
        }

        function hideError() {
            errorMessage.classList.add('hidden')
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault()
            hideError()

            const email = document.getElementById('email').value
            const password = document.getElementById('password').value

            // 버튼 비활성화
            loginButton.disabled = true
            loginButton.textContent = '로그인 중...'

            try {
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                })

                if (error) throw error

                console.log('✅ 로그인 성공:', data)

                // 리다이렉트
                const urlParams = new URLSearchParams(window.location.search)
                const redirect = urlParams.get('redirect') || '/gacha.html'
                window.location.href = redirect

            } catch (error) {
                console.error('❌ 로그인 실패:', error)
                showError(error.message || '로그인에 실패했습니다.')

                // 버튼 재활성화
                loginButton.disabled = false
                loginButton.textContent = '로그인'
            }
        })
    </script>
</body>

</html>
