<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>개념 가챠 - 인쇄 센터</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <style>
        body { font-family: 'Inter', 'Noto Sans KR', sans-serif; }
        .box-badge { @apply inline-flex items-center px-3 py-1 rounded-lg text-xs font-bold border-2 cursor-pointer transition-all select-none; }
    </style>
</head>

<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-200 h-screen flex overflow-hidden">

    <aside class="w-72 bg-white dark:bg-slate-900 border-r border-slate-100 dark:border-slate-800 flex flex-col justify-between z-20 hidden lg:flex"></aside>

    <main class="flex-1 p-6 lg:p-12 overflow-y-auto">
        <div class="flex justify-between items-center mb-10">
            <h1 class="text-3xl font-black flex items-center gap-3">
                <span class="material-symbols-outlined text-orange-500">print</span>
                인쇄 센터
            </h1>
            <button class="p-3 rounded-full bg-white dark:bg-slate-900 border border-slate-100 dark:border-slate-800 shadow-sm"
                onclick="document.documentElement.classList.toggle('dark')">
                <span class="material-symbols-outlined">dark_mode</span>
            </button>
        </div>

        <div class="max-w-3xl space-y-6">

            <!-- 학생 선택 -->
            <section class="bg-white dark:bg-slate-900 rounded-[2rem] p-8 shadow-xl border border-slate-100 dark:border-slate-800">
                <h2 class="text-lg font-bold mb-5 flex items-center gap-2">
                    <span class="material-symbols-outlined text-orange-500">group</span>
                    학생 선택
                </h2>
                <div id="studentCheckList" class="flex flex-wrap gap-2 mb-3">
                    <span class="text-slate-400 text-sm">불러오는 중...</span>
                </div>
                <p class="text-xs text-slate-400 mt-2">여러 명 선택 시 ZIP으로 다운로드됩니다</p>
            </section>

            <!-- 플래시카드 시트 -->
            <section class="bg-white dark:bg-slate-900 rounded-[2rem] p-8 shadow-xl border border-slate-100 dark:border-slate-800">
                <h2 class="text-lg font-bold mb-5 flex items-center gap-2">
                    <span class="material-symbols-outlined text-blue-500">style</span>
                    플래시카드 시트
                </h2>

                <!-- 상자 필터 -->
                <div class="mb-6">
                    <label class="text-xs font-bold text-slate-400 uppercase mb-3 block">상자 필터 (미선택 시 전체)</label>
                    <div class="flex gap-2 flex-wrap" id="boxFilter">
                        <label class="box-badge border-red-200 bg-red-50 text-red-600 dark:bg-red-900/10 dark:border-red-900/30 dark:text-red-400">
                            <input type="checkbox" value="1" class="hidden" />상자 1 · C급
                        </label>
                        <label class="box-badge border-orange-200 bg-orange-50 text-orange-600 dark:bg-orange-900/10 dark:border-orange-900/30 dark:text-orange-400">
                            <input type="checkbox" value="2" class="hidden" />상자 2 · B급
                        </label>
                        <label class="box-badge border-blue-200 bg-blue-50 text-blue-600 dark:bg-blue-900/10 dark:border-blue-900/30 dark:text-blue-400">
                            <input type="checkbox" value="3" class="hidden" />상자 3 · A급
                        </label>
                        <label class="box-badge border-emerald-200 bg-emerald-50 text-emerald-600 dark:bg-emerald-900/10 dark:border-emerald-900/30 dark:text-emerald-400">
                            <input type="checkbox" value="4" class="hidden" />상자 4 · S급
                        </label>
                        <label class="box-badge border-yellow-200 bg-yellow-50 text-yellow-600 dark:bg-yellow-900/10 dark:border-yellow-900/30 dark:text-yellow-400">
                            <input type="checkbox" value="5" class="hidden" />상자 5 · SS급
                        </label>
                    </div>
                </div>

                <button id="btnFlashcard"
                    onclick="printFlashcard()"
                    class="w-full py-4 rounded-2xl bg-gradient-to-r from-blue-500 to-blue-600 text-white font-bold hover:opacity-90 transition-all shadow-lg shadow-blue-500/20 flex items-center justify-center gap-2">
                    <span class="material-symbols-outlined">download</span>
                    플래시카드 PDF 다운로드
                </button>
            </section>

            <!-- 벌크 다운로드 -->
            <section class="bg-white dark:bg-slate-900 rounded-[2rem] p-8 shadow-xl border border-slate-100 dark:border-slate-800">
                <h2 class="text-lg font-bold mb-5 flex items-center gap-2">
                    <span class="material-symbols-outlined text-emerald-500">folder_zip</span>
                    전체 학생 일괄 다운로드
                </h2>
                <p class="text-sm text-slate-500 mb-5">위에서 선택한 학생들의 시트를 ZIP으로 한 번에 다운로드합니다</p>

                <button id="btnBulkFlash"
                    onclick="printBulk('flashcard')"
                    class="w-full py-4 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-500 text-white font-bold hover:opacity-90 transition-all shadow-lg shadow-emerald-500/20 flex items-center justify-center gap-2">
                    <span class="material-symbols-outlined">folder_zip</span>
                    전체 학생 ZIP 다운로드
                </button>
            </section>

        </div>
    </main>

    <script type="module" src="js/api.js"></script>
    <script src="js/layout.js"></script>
    <script>
        // 체크박스 토글 스타일
        document.getElementById('boxFilter').querySelectorAll('label').forEach(label => {
            label.addEventListener('click', () => {
                const cb = label.querySelector('input[type=checkbox]');
                cb.checked = !cb.checked;
                label.classList.toggle('ring-2', cb.checked);
                label.classList.toggle('ring-offset-1', cb.checked);
            });
        });

        function getSelectedStudents() {
            return [...document.querySelectorAll('#studentCheckList input[type=checkbox]:checked')]
                .map(cb => cb.value);
        }

        function getBoxFilter() {
            return [...document.getElementById('boxFilter').querySelectorAll('input:checked')]
                .map(cb => parseInt(cb.value));
        }

        function triggerDownload(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            setTimeout(() => URL.revokeObjectURL(url), 5000);
        }

        function setLoading(btnId, loading) {
            const btn = document.getElementById(btnId);
            if (!btn) return;
            btn.disabled = loading;
            btn.style.opacity = loading ? '0.6' : '';
            btn.style.cursor = loading ? 'wait' : '';
        }

        async function printFlashcard() {
            const ids = getSelectedStudents();
            if (ids.length === 0) return showError('학생을 선택해주세요');
            if (ids.length > 1) return printBulk('flashcard');

            setLoading('btnFlashcard', true);
            try {
                const blob = await API.printFlashcard(ids[0], getBoxFilter());
                triggerDownload(blob, `flashcard_${ids[0]}.pdf`);
            } catch (e) {
                showError(e.message);
            } finally {
                setLoading('btnFlashcard', false);
            }
        }

        async function printBulk(type) {
            const ids = getSelectedStudents();
            if (ids.length === 0) return showError('학생을 선택해주세요');

            setLoading('btnBulkFlash', true);
            try {
                const blob = await API.printBulk(ids, 'flashcard', getBoxFilter());
                triggerDownload(blob, `bulk_flashcard_${Date.now()}.zip`);
            } catch (e) {
                showError(e.message);
            } finally {
                setLoading('btnBulkFlash', false);
            }
        }

        function showError(msg) {
            Layout.showToast(msg, true);
        }

        async function loadStudents() {
            const list = document.getElementById('studentCheckList');
            try {
                const students = await API.getStudents();
                if (students.length === 0) {
                    list.innerHTML = '<span class="text-slate-400 text-sm">등록된 학생이 없습니다</span>';
                    return;
                }

                // 현재 학생을 기본 선택
                const current = Layout.currentStudent;

                list.innerHTML = students.map(s => `
                    <label class="flex items-center gap-2 px-4 py-2 rounded-xl border-2 cursor-pointer transition-all select-none
                        ${current && current.id === s.id
                            ? 'border-orange-400 bg-orange-50 dark:bg-orange-900/10'
                            : 'border-slate-100 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 hover:border-orange-200'}
                        " id="lbl_${s.id}">
                        <input type="checkbox" value="${s.id}" class="student-cb accent-orange-500"
                            ${current && current.id === s.id ? 'checked' : ''}
                            onchange="toggleStudentLabel('${s.id}', this.checked)"
                        />
                        <span class="font-bold text-sm">${s.name}</span>
                    </label>
                `).join('');
            } catch (e) {
                list.innerHTML = '<span class="text-red-400 text-sm">로드 실패</span>';
            }
        }

        function toggleStudentLabel(id, checked) {
            const lbl = document.getElementById('lbl_' + id);
            if (!lbl) return;
            if (checked) {
                lbl.classList.add('border-orange-400', 'bg-orange-50', 'dark:bg-orange-900/10');
                lbl.classList.remove('border-slate-100', 'dark:border-slate-800', 'bg-slate-50', 'dark:bg-slate-950');
            } else {
                lbl.classList.remove('border-orange-400', 'bg-orange-50', 'dark:bg-orange-900/10');
                lbl.classList.add('border-slate-100', 'dark:border-slate-800', 'bg-slate-50', 'dark:bg-slate-950');
            }
        }

        if (window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.classList.add('dark');

        document.addEventListener('DOMContentLoaded', () => {
            Layout.init();
            loadStudents();
        });
    </script>
</body>

</html>
