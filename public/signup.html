<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - Concept Gacha</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
        }
    </style>
</head>

<body class="bg-gradient-to-br from-purple-50 to-blue-50 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full">
        <!-- 로고 -->
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-purple-600 mb-2">🎴 Concept Gacha</h1>
            <p class="text-gray-600">학습 카드 관리 시스템</p>
        </div>

        <!-- 회원가입 카드 -->
        <div class="bg-white rounded-2xl shadow-xl p-8">
            <h2 class="text-2xl font-bold text-gray-800 mb-6">회원가입</h2>

            <!-- 에러 메시지 -->
            <div id="errorMessage" class="hidden mb-4 p-4 bg-red-50 border border-red-200 rounded-lg">
                <p class="text-red-600 text-sm"></p>
            </div>

            <!-- 성공 메시지 -->
            <div id="successMessage" class="hidden mb-4 p-4 bg-green-50 border border-green-200 rounded-lg">
                <p class="text-green-600 text-sm"></p>
            </div>

            <!-- 회원가입 폼 -->
            <form id="signupForm" class="space-y-4">
                <div>
                    <label for="name" class="block text-sm font-medium text-gray-700 mb-2">
                        이름
                    </label>
                    <input type="text" id="name" name="name" required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none transition"
                        placeholder="홍길동">
                </div>

                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
                        이메일
                    </label>
                    <input type="email" id="email" name="email" required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none transition"
                        placeholder="your@email.com">
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
                        비밀번호
                    </label>
                    <input type="password" id="password" name="password" required minlength="6"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none transition"
                        placeholder="최소 6자 이상">
                    <p class="mt-1 text-xs text-gray-500">영문, 숫자 조합 권장</p>
                </div>

                <div>
                    <label for="passwordConfirm" class="block text-sm font-medium text-gray-700 mb-2">
                        비밀번호 확인
                    </label>
                    <input type="password" id="passwordConfirm" name="passwordConfirm" required minlength="6"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none transition"
                        placeholder="비밀번호 재입력">
                </div>

                <button type="submit" id="signupButton"
                    class="w-full bg-purple-600 hover:bg-purple-700 text-white font-medium py-3 rounded-lg transition duration-200 transform hover:scale-[1.02] active:scale-[0.98]">
                    가입하기
                </button>
            </form>

            <!-- 로그인 링크 -->
            <div class="mt-6 text-center">
                <p class="text-gray-600">
                    이미 계정이 있으신가요?
                    <a href="login.html" class="text-purple-600 hover:text-purple-700 font-medium">
                        로그인
                    </a>
                </p>
            </div>
        </div>

        <!-- 푸터 -->
        <div class="mt-8 text-center text-sm text-gray-500">
            <p>© 2024 Concept Gacha. All rights reserved.</p>
        </div>
    </div>

    <script type="module">
        import { supabase } from './js/supabase-client.js'
        import { getCurrentUser } from './js/auth.js'

        // 이미 로그인된 경우 리다이렉트 (상대 경로)
        const user = await getCurrentUser()
        if (user) {
            window.location.href = './gacha.html'
        }

        const signupForm = document.getElementById('signupForm')
        const signupButton = document.getElementById('signupButton')
        const errorMessage = document.getElementById('errorMessage')
        const successMessage = document.getElementById('successMessage')

        function showError(message) {
            errorMessage.classList.remove('hidden')
            errorMessage.querySelector('p').textContent = message
            successMessage.classList.add('hidden')
        }

        function showSuccess(message) {
            successMessage.classList.remove('hidden')
            successMessage.querySelector('p').textContent = message
            errorMessage.classList.add('hidden')
        }

        function hideMessages() {
            errorMessage.classList.add('hidden')
            successMessage.classList.add('hidden')
        }

        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault()
            hideMessages()

            const name = document.getElementById('name').value
            const email = document.getElementById('email').value
            const password = document.getElementById('password').value
            const passwordConfirm = document.getElementById('passwordConfirm').value

            // 비밀번호 확인
            if (password !== passwordConfirm) {
                showError('비밀번호가 일치하지 않습니다.')
                return
            }

            // 버튼 비활성화
            signupButton.disabled = true
            signupButton.textContent = '가입 중...'

            try {
                // Supabase Auth 회원가입
                const { data, error } = await supabase.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: {
                            name: name  // user_metadata에 이름 저장
                        }
                    }
                })

                if (error) throw error

                console.log('✅ 회원가입 성공:', data)

                // 성공 메시지 표시
                showSuccess('회원가입이 완료되었습니다! 로그인 페이지로 이동합니다...')

                // 2초 후 로그인 페이지로 리다이렉트 (상대 경로)
                setTimeout(() => {
                    window.location.href = './login.html'
                }, 2000)

            } catch (error) {
                console.error('❌ 회원가입 실패:', error)

                let errorMsg = '회원가입에 실패했습니다.'
                if (error.message.includes('already registered')) {
                    errorMsg = '이미 등록된 이메일입니다.'
                } else if (error.message) {
                    errorMsg = error.message
                }

                showError(errorMsg)

                // 버튼 재활성화
                signupButton.disabled = false
                signupButton.textContent = '가입하기'
            }
        })
    </script>
</body>

</html>
